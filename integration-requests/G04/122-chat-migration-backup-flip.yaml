notes:
  - 恢复语义：每个条目 blob 先内容寻址校验 + fsync + publish，再与
    media_object/media_ref/media_file/imported 游标同事务提交；全部条目落盘后
    才调用快照端口切聊天记录游标（importing -> chat_committed -> completed）。
  - 失败可回滚：chat 提交前失败 = state failed，POST rollback 撤销 restore
    引用与合成文件行、按引用计数回收对象（去重命中的内容保留）、游标复位可重跑；
    completed 之后拒绝回滚（409），那是数据丢失不是错误恢复。
  - 「先落盘」有磁盘级失败注入证据（补 G04 代理首轮只注入了 G05 端口故障）：
    tests/g04.rs 用 ObjectStore 包装（FaultStore）在 put_file 上注入两种故障——
    (1) 落盘报错且一字节未写、(2) 字节已 rename 到位但回执丢失（断电那一格）。
    两条用例都断言 media_backup_entry.imported 一律不前进、快照端口 import()
    零次调用、state 停在 failed；用例 (2) 再断言 rollback 后现场（盘上字节、
    media_object/media_ref/media_file 行数、逐条游标）逐项等于恢复前快照。
  - 回滚的孤儿清扫只针对「账上无人引用」的内容地址：无 media_object 行（含软删）
    且无 live 引用/文件行/未过期分享才删；本地已有同内容原件、他人对象、
    dedup 命中的字节一律保留（第三条用例专门钉住这一点）。
  - 状态机不倒退：上传会话状态机与「未完成上传不可引用为附件」基线测试
    （instant_upload.rs / g04.rs）未放宽，本卡全部通过。
  - 转码隔离执行面（G04-03）未被本卡触碰。
