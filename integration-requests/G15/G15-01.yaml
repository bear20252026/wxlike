# G15-01 动作目录与协议 SDK 适配 —— 集成请求
# 本文件登记超出 G15 独占写路径、需要 G00 或其他组执行的条目。
# G15 独占：crates/cmd/**、crates/cli/**、crates/mcp/**、crates/agent-policy/**。

request_id: G15-01
task_issue: 183
group_issue: 96
contract_version: action-catalog-v1
artifacts:
  - crates/cmd/src/catalog.rs
  - crates/cmd/src/catalog/spec.rs
  - crates/mcp/src/server.rs
  - crates/mcp/src/transport.rs
  - crates/cli/src/args.rs
