    人读 `wxlike coverage`，AI 读 MCP 资源 `wxlike://coverage`。
  - 当前 26 条命令全部有归属（64 条入口 = 自动 26 + 宿主 5 + 未做 33）；
    33 条未做入口每条都带负责组与 issue 编号，
    不存在"没登记所以看起来支持"的入口。
  - 平台差异：命令级 `platforms` 由 catalog 声明并在覆盖报告里逐条输出；
    相机/扫码/文件选择等宿主能力只登记为 `host_only`，MCP 不提供伪远程工具。
