contract: protocol frame / QR / package / media / parser fuzz corpus
entry_ids: []
action_ids: []

paths:
  - tests/security/tests/fuzz.rs
  - tests/security/tests/web.rs
  - tests/security/tests/sandbox.rs
  - tests/security/corpus/**
  - security/release-reviews/blockers.json（blocked 样本的登记处，G17-05 交叉核对）

root_registration:
  - action: ci_job
    workflow: .github/workflows/ci.yml
    job: security
    step: "cargo test --manifest-path tests/security/Cargo.toml --test fuzz --test web --test sandbox"
    note: 变异 fuzz 是确定性的（固定种子 xorshift64），2000 次变异约 8 秒，可放进每次 PR
  - action: workflow_file
    file: .github/workflows/security-fuzz.yml（新建，归 G00 装配）
    owner: G00
    snippet: |
      name: security-fuzz
      on:
        schedule: [{ cron: "41 4 * * *" }]   # 每日 UTC 04:41，避开整点
        workflow_dispatch:
      permissions: { contents: read }
      jobs:
        long-fuzz:
          runs-on: ubuntu-latest
          timeout-minutes: 45
          steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            # 长跑：同一批用例循环放大变异次数，命中即上传最小样本
            - name: mutation fuzz (long)
              env: { WXLIKE_FUZZ_ITERS: "200000" }
              run: cargo test --manifest-path tests/security/Cargo.toml --test fuzz mutation_fuzz -- --nocapture
            - name: upload crash corpus
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                name: fuzz-crash-corpus
                path: tests/security/corpus
    note: |
      2026-10-25 已参数化 WXLIKE_FUZZ_ITERS，独立 security.yml 合并每日长跑；
      失败变异输入保存到 WXLIKE_FUZZ_CRASH_DIR，由同一工作流上传。

