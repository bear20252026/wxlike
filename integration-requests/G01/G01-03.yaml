card: G01-03
issue: 106
branch: feat/FP-G01-03
contract_version: "1.0"
summary: Rust WASM 网页可运行闭环

requests:
  - id: G01-03-R1
    kind: workspace-member
    status: applied-pending-ratification
    reason: >-
      同 G01-01-R1。本 crate 的浏览器代码只在 wasm32 上编译，
      原生构建只编译 policy 模块（纯逻辑）。
    change:
      file: Cargo.toml
      path: members
      add: ["crates/client-web"]

  - id: G01-03-R2
    kind: ci
    status: applied-pending-ratification
    reason: >-
      没有 wasm 任务时，这个 crate 在 CI 里等于不存在——浏览器代码永远不会
      被编译，写了等于没写。
    change:
      job: wasm
      runs_on: ubuntu-latest
      steps:
        - rustup target add wasm32-unknown-unknown
        - cargo check -p wxlike-client-web --target wasm32-unknown-unknown
        - cargo clippy -p wxlike-client-web --target wasm32-unknown-unknown -- -D warnings
        - bash scripts/build-wasm.sh
    applied: >-
      2026-11-20（feat/G01-03-wasm-pack）：wasm 作业已加 wasm-pack（v0.13.1
      固定）与 `bash scripts/build-wasm.sh`——产出 packages/wasm-client 并自检
      package.json/.wasm/.js/.d.ts，缺一即红。known-gaps 的
      G01-03-WASM-PACKAGE 随之关闭；消费侧拆为 G01-03-WASM-CONSUMER（G10）。
      2026-11-21（feat/G01-03-browser-acceptance / #456）：新增 wasm-browser
      作业（C6b）跑 `wasm-pack test --headless --chrome crates/client-web`，
      注册进 required-checks 并由 gate 依赖（阻断）；G01-03-WASM-CONSUMER
      随之关闭。
    note: >-
      chromedriver 方案已落地：wasm-browser 作业在预装缺失时 apt 装 chromedriver，
      与镜像自带 chrome 版本绑定；tests/browser.rs 的 8 个用例在 headless
      Chrome 里真实执行（IndexedDB / WebCrypto / fetch / Web Locks）。

  - id: G01-03-R3
    kind: ui-handoff
    status: requested
    reason: >-
      页面胶水要挂 lifecycle 监听并续租；不续租的话跨 tab 互斥会在 15s 后
      失效（另一个 tab 就能抢走租约）。
    change:
      file: ui/src/web/
      owner: G04
      action: |
        document.addEventListener('visibilitychange', ...)  // 前台/后台
        document.addEventListener('freeze', ...)            // 被冻结
        document.addEventListener('resume', ...)            // 恢复 → 重新校验游标
        setInterval(() => platform.renew_lease(), 5000)     // 续租

  - id: G01-03-R4
    kind: security-review
    status: requested
    reason: >-
      缓存密钥目前放 localStorage（同源 JS 可读）。这不是秘密泄露级别的
      问题（同源本来就能读缓存），但值得评估更强的隔离。
    change:
      owner: G17
      action: 评估改用不可导出 CryptoKey + IndexedDB 结构化克隆，替换 localStorage 方案
