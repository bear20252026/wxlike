summary: >-
  新版状态、位置消息/实时共享、我的二维码四样式与公众号整合入口已完成。
  地图/导航、拍照与相册、二维码渲染由平台桥提供；共享会话与码轮换以服务端
  状态为准，离页不伪造"已停止"。

