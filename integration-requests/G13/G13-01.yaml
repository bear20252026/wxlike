status: requested
summary: >-
  朋友圈、公众号、收藏、表情与卡片内容页面已完成；需要 G01 生成
  ContentPort/PublisherPort/FormatPort 绑定，并由 G00 把页面挂到发现/我。
  真实域实现未合入前，页面以 Unavailable*Port 显示阻塞，不返回静态数据。

