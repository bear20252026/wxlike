  - apps/mobile/lib/features/content/g13/
  - apps/mobile/lib/features/content/moments_page.dart
  - apps/mobile/lib/features/content/reading_page.dart
  - apps/mobile/lib/features/content/favorites_page.dart
  - apps/mobile/lib/features/content/stickers_page.dart
  - apps/mobile/test/g13/

requests:
  - id: G13-01-R1
    kind: ffi-bindings
    target: G01
    status: requested
    reason: >-
      页面只通过 Dart 端口访问 Rust；SessionInfo 不含 token，Dart 无法自行
      认证 HTTP 域服务，必须由生成绑定在 Rust 侧完成鉴权与重试分类。
    change:
      commands:
        - content.moments
        - content.publish
        - content.like
        - content.comment
        - content.delete
        - favorite.list
        - favorite.add
        - favorite.remove
        - sticker.list
        - sticker.download
        - publisher.list
        - publisher.subscribe
        - publisher.articles
        - publisher.article
        - format.money
    note: >-
      失败必须映射为 DomainError（offline/timeout/unauthorized/forbidden/
      invalid_argument/conflict/unavailable），界面只认 G13FailureKind。

  - id: G13-01-R2
    kind: composition-root
    target: G00
    status: requested
    reason: G13 不修改根 router/组合根；页面需要真实端口注入后才能验收。
    change:
      - inject: G13Ports(format, content, publisher, ...) 于应用组合根
      - mount_entry: discover.moments -> MomentsPage
      - mount_entry: discover.favorites -> FavoritesPage
      - mount_entry: discover.stickers -> StickerPacksPage
      - mount_entry: chat.subscriptions -> PublisherListPage（订阅号消息入口）
    note: 未注入时页面显示 "上游生成绑定未接入"，不得回退为示例内容。

  - id: G13-01-R3
    kind: contract-ratification
    target: G00
    status: requested
    reason: 页面契约版本 g13/1 需要登记到公共契约清单，后续升级两侧同步。
    change:
      doc: docs/full-platform-delivery/01_contracts_and_data.md
      add: 契约版本 g13/1（PageResult/Money/ActionConfirmation/OperationHandle 形状）

upstream:
  - G05-05 (content/favorites/sticker 域服务)
  - G05-02 (publisher 列表/文章/订阅)
  - G12-05 (平台桥；本卡暂无硬桥需求，卡片图片解码由列表提供短时地址)

verification:
