contract_change:
  file: contracts/domains/identity/contract.json
  action: add_error_code
  current_error_codes:
    - bad_input
    - unauthorized
    - forbidden
    - not_found
    - conflict
    - expired
    - rate_limited
  requested_addition: corrupt
  reason: >
    IdError::Corrupt 在本 crate 已经存在（#114 的作业行加固引入），但
    identity-v1 的 error_codes 清单一直没有登记它。本 PR 又新增了三处会返回
    Corrupt 的路径（会话列表受众、刷新链受众、扫码挑战状态），契约不登记的话，
    客户端与其他组按契约生成的错误处理表会把 500 当成未知错误吞掉或误重试。
    HTTP 侧建议映射 500，响应体不回显列名与令牌片段。
  affected_commands:
    - command: identity.session.list
      trigger: sessions.audience 不是 user/admin
    - command: identity.refresh
      trigger: identity_refresh.audience 不是 user/admin
    - command: identity.qr_login.poll
      trigger: identity_qr.state 不在六状态集合内
    - command: identity.qr_login.exchange
      trigger: 同上
    - command: identity.qr_login.refresh
      trigger: 同上
  compatibility: additive，不改任何既有 code 的语义

behavior_change:
  - name: 扫码兑换时的设备归属对齐
    file: crates/features/identity/src/qr_login.rs
    function: exchange / adopt_device
    what: >
      桌面在扫码前没有账号，bind 只记录 device_id，设备行并不存在；而会话是
      开给扫码批准方的，session::open 又要求设备行属于该用户。过去直接开会话，
      于是两条路都错：正常路径会得到 Forbidden("device revoked")，整张卡走不通；
      无条件覆盖归属的话，攻击者可以先占同一个 device_id 再等受害者批准。
    rule: 没有设备行就以批准者名义登记；device_id 已被别人登记则拒绝（NotFound）。
    impact: >
      这是 #115 的正常路径修复，HTTP handler 不需要改签名。注意兑换失败时挑战
      已经被置为 consumed，属于有意的失败封闭——已归属冲突的 device_id 不该被
      重试到成功。
  - name: 移除设备时一并清掉绑在该会话上的 step-up 授权
    file: crates/features/identity/src/device.rs
    function: revoke
    what: >
      session::logout 会连带 DELETE identity_step_up，而 device::revoke 过去只删
      会话不删授权，导致"移除设备"与"退出登录"两条撤销路径强度不一致：前者会
      留下一条绑在这台设备上的敏感操作授权。现在两边一致。
    ordering_note: 清理必须在删除 sessions 行之前，否则子查询取不到 sid，会静默失效。

