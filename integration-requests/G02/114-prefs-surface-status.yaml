what_this_pr_adds_for_114:
  - name: 好友私有偏好的越权与隔离面
    files:
      - crates/features/relations/tests/friend_prefs_surface.rs
      - crates/features/relations/tests/group_rbac.rs
    covers: >
      备注/星标/标签是每人自己的一套，对方读不到；这三样不参与任何权限判定
      （改备注成"老板"不会换来权限，星标不改变消息闸门）；标签整体替换是原子的，
      校验失败不许把已存在的标签清空；非好友写偏好一律 NotFound 而不是顺手建行。
  - name: 偏好读法里的 fail-closed 口径统一
    files:
      - crates/features/identity/src/session.rs
      - crates/features/identity/src/refresh.rs
      - crates/features/identity/tests/corrupt_identity_rows.rs
    covers: >
      #114 已经把 identity_job 的 kind/status 折默认值改成 Corrupt（见
      tests/preferences_jobs.rs）。本 PR 把同一口径补到剩下三处会"假装正常"的
      读法上：会话受众、刷新链受众、扫码挑战状态——它们全都直接影响
      "这条凭据属于哪一面、能不能进管理面"，与 G02-05 强调的设置面重启生效
      是同一条底线。

