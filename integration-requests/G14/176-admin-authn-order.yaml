notes:
  - 认证与授权分层：门只做认证（你是谁），`auth::require` / `rbac::authorize` /
    step-up 窗口仍然是服务端唯一的授权判定点，一个都没少。
  - 门外的路径只有三条精确匹配（`/`、`/health`、`/api/login`）加一条按形状判定的
    `GET /api/g14/privacy/requests/{id}/download`；后者由一次性 `download_token`
    自己绑对象、过期与哈希，带后台会话也不能代替它（有用例钉住）。
  - 静态运营令牌的写尝试现在也会落一条 `g14.denied`（outcome=denied，
    actor=operator-token，role 字段记 audience）。以前这条路径直接返回 403，
    一个审计行都不写。
  - 留痕写入失败不再静默：`Store` 计数、`/api/g14/audit/verify` 的
    `chain.append_failures` 可见，且**不会**把 403 变成 200（拒绝优先于留痕）。
  - 未结项：登录限流与账号锁定（`docs/adminx.md` §11）仍不在本卡；
    本卡没有引入新依赖，也没有新增数据库对象。
