  - `g14_journal` 由触发器拒 UPDATE；分录号重放被拒（只能冲销，不能改写）。
  - 退款双人阈值 500000 分（¥5000）；同一审批人重复批准不计入双人。
  - CSV 导出对 `= + - @` 开头的单元格加 `'` 前缀（防公式注入）。
