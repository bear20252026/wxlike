  - id: REQ-G08-service-catalog-visibility
    target: G08-04
    action: 服务卡片可见性端点 `POST /api/admin/services/{id}/visibility`（body: state, note），
      并确认目录页按 region 过滤时读的是同一份配置。
    blocking: false
    rationale: 服务卡片下架要能反映到客户端目录；G14 只存配置与版本。

  - id: REQ-G02-vault-ref-contract
    target: G02-03
    action: 确认 `vault://<path>#<key>` 引用格式与解密侧一致；后台只写引用、不写明文。
    rationale: G14-03 在入口强制 vault:// 前缀，格式必须与密钥服务对齐，否则引用写进去也解不开。
    evidence: crates/admin/tests/g14_03_publishing.rs::service_config_refuses_plaintext_secrets_and_versions_changes

notes:
  - 审核规则版本按 kind 固定（content-policy-2026.10 / mini-review-2026.09 /
    service-catalog-2026.10），每条待审项落"按哪一版规则判的"，便于事后复核。
  - 小程序撤回（revoke）按 Destructive 处理：仅 superadmin + 步进验证。
    若业务要求发布岗自行撤回，需 G14 组与 G00 一起改矩阵并补用例。
  - 幂等：提交用 idem，发布用版本状态机；发布失败后状态停在 signed，可重试且不产生新版本。
