  - id: REQ-G07-mini-release-lifecycle
    target: G07-07
    action: 提供三个端点：`POST /api/admin/mini/{app}/versions/{v}/sign`（回 signature）、
      `/publish`（body: signature，回 reference）、`/revoke`（body: reason）。
      签名密钥只在 G07 侧，**不要**把私钥或签名服务凭据交给 adminx。
    rationale: 签包与发布是 G07 的能力，后台只是编排与权限分离。
    blocking: true
