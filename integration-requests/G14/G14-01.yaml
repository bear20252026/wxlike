requests:
  - id: REQ-G00-02-register-admin-audience
    target: G00-02
    action: 在全局身份契约里登记 adminx 的独立 audience（`admin_session` / `operator`），
      并确认用户令牌（wxu_ 前缀）在网关层就被拒绝，不要只依赖 adminx 自己拦。
    rationale: G14-01 的"普通 token 无法访问管理 API"目前由 adminx 进程内判定；
      网关层再拦一次才能防"adminx 端口被直接暴露"。
    evidence: crates/admin/tests/g14_01_auth_audit.rs::end_user_tokens_and_unknown_tokens_are_refused

  - id: REQ-G00-03-audit-schema-numbering
    target: G00-03
    action: 给 adminx 的 0001 迁移登记 schema 编号（本进程 `PRAGMA user_version = 1`），
      并在串行迁移表里注明它**只动 adminx.db、不碰平台库**。
    rationale: 迁移编号是本项目唯一的串行资源；G14 自己占号会与平台迁移冲突。
    evidence: crates/admin/tests/g14_01_auth_audit.rs::audit_chain_verifies_and_tampering_would_show_up

  - id: REQ-G16-ci-g14-tests
    target: G16
    action: CI 增加 `cargo test -p wxlike-admin --lib --test g14_01_auth_audit
      --test g14_02_identity --test g14_03_publishing --test g14_04_commerce --test g14_05_jobs`
      一步；G14 的写路径全部走 HTTP router，不需要外部服务。
    rationale: 五张卡的全部验收面都在这批用例里，漏跑等于没有门禁。

