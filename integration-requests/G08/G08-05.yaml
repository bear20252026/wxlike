# G08 integration requests executed by G00/G11/G13/G17 (contract version: mini-host.v1 / mini-package.v1 / mini-catalog.v1).
task: G08-05
group: G08
branch: feat/FP-G08-05
requests:
  - id: example-catalog-seed
    file: server
    change: >-
      Register the four dev-channel example apps (com.wxlike.demo.notes,
      com.wxlike.demo.shop, com.wxlike.demo.game, com.wxlike.demo.weather) in
      the reviewed catalog as publisher wxlike-labs, or serve them only on dev
      builds. They are the minimal runnable ecosystem, not production apps.
    owner: G01
    reason: The catalog only ever serves reviewed entries; examples must go
      through the same source or be dev-only.
  - id: ui-card-audit
    file: ui
    change: >-
      Render mini-app cards only from packages/mini-sdk/examples/ui-cards.json
      rules: status signed_example/authorized cards launch by app_id;
      blocked_external cards (Tencent Maps, WeChat Read, etc.) must not be
      shown as launchable until a real publisher authorization exists.
    owner: G11
    reason: Every UI app card must map to a valid signed package or an
      authorized real app; decorative fake cards are forbidden.
  - id: mobile-card-audit
    file: ui-mobile
    change: >-
      Same card audit as the desktop shell for the 27 mobile screens
      (MiniProgramsScreen and the nearby list).
    owner: G13
    reason: Same rule on mobile; the audit table lists card_id per surface.
  - id: guest-transport-examples
    file: ui
    change: >-
      Inject the SDK client as globalThis.__wxMini into example WebViews and
      call onLoad/onShow; the embedded wxhost path is only a fallback for the
      Boa host, never the production bridge.
    owner: G11
    reason: The examples are written against mini-host.v1; the shell owns the
      transport wiring.
  - id: mini-cli-distribution
    file: ci
    change: >-
      Build the `mini` binary (crates/features/miniapps/src/bin/mini.rs) in CI
      packaging jobs; pack in CI, sign with the offline publisher key.
    owner: G00
    reason: Packing and signing are separate steps by design; CI must not
      hold publisher signing keys.
router: none
commands: []
migrations: >-
  None. Examples store guest data through the host bridge only; there is no
  local database in wxlike-miniapps.
notes: >-
  Workspace-internal dev-dependency wxlike-container (path) was added to
  crates/features/miniapps for the four-target test; Cargo.lock gains the
  corresponding dependency edge and must be regenerated by G00 together with
  the next root change. No new external dependencies. The four native shells
  (desktop/web/android/ios) still need the integration run: this card ships
  the same signed package plus per-target host/profile/persistence tests, the
  shell wiring itself is G11/G13/G17.
