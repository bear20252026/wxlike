  - 关联入口（交付种子 44 条中的 G03-01 部分，`TO_EXPAND_G00-01` 展开后仍以
    entries.json 为准）：SEED-0028 send、SEED-0140 send、SEED-0141 按住说话松开发送、
    SEED-0022/0026/0034 消息气泡操作（撤回/复制/转发/引用，原型 `b.fn` 待展开）、
    SEED-0136 item.onClick。
  - 判属他组、不由 G03 认领：SEED-0025 资料页、SEED-0030/0149 聊天文件、
