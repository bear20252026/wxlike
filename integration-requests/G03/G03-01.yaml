requests:
  - id: REQ-G00-02-move-messaging-submit
    target: G00-02
    action: 纯移动 `crates/message/src/submit.rs` → `crates/features/messaging/src/submit/`
      （卡面计划路径），与 `crates/features/messaging/Cargo.toml` 一起登记；
      移动前 G03 只能落在独占根 `crates/message/**`。
    rationale: G00-02 尚未执行，卡面目标目录不存在；G03 不得越界建 features/。

  - id: REQ-G00-03-ratify-messaging-contracts
    target: G00-03
    action: 批准本卡实际实现的命令面命名与幂等键形状：
      `messaging.send{owner, sender_device, idempotency_key, msg_id, type_id, payload,
      body_kind, recipients[], forward_of}`、`messaging.edit{msg_id, expected_version,
      payload}`、`messaging.recall{msg_id}`、`messaging.forward{source_msg_id, …}`；
      唯一键 = (`sender_device`, `idempotency_key`)。
    rationale: 幂等键作用域是提交卡的核心决策，冻结权在 G00-03。

  - id: REQ-G00-migration-numbering
    target: G00
    action: 为 `message_submit`、`mailbox` 新列（sender_device/body_kind/edit_version/
      recalled_at_ms/forward_of）分配 schema 编号；列名以代码为准，回滚兼容说明见
      `crates/message/src/lib.rs` 的 `add_missing_columns`。
    rationale: 迁移编号由 G00 串行分配，避免多组撞号。

  - id: REQ-G10-send-caller-contract
    target: G10
    action: 桌面/网页发送改走 `submit`（不再走 `append`），并按
      (`sender_device`, `idempotency_key`) 生成键；响应丢失后重发同一键即可，
      服务端只落一条。`recipients` 必须包含发送者自己的其它设备（多端回显），
      信箱不猜成员关系。
    rationale: 提交语义换了调用面才生效；G03 不改 UI 组文件。

  - id: REQ-G02-membership-event-time
    target: G02-02
    action: 群成员 join/leave 需按会话 seq 边界给出 `joined_seq`/`left_seq`
      （本卡按事件时间判定可见性，不用墙钟）；退群后补发的裁决见
      `SubmitRecipient::eligible_at`。
    rationale: 成员可见窗口是关系层事实，信箱只消费。

notes:
