[package]
name = "wxlike-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
wxlike-core = { path = "../../crates/core" }
wxlike-net = { path = "../../crates/net" }
# WP-11: all backend interaction goes through these Rust commands (the
# frontend never speaks HTTP/QUIC itself). ureq = small sync client on rustls.
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
# command-layer tests drive a REAL in-process server (platform + QUIC hub),
# never a mock — the task book forbids mock stand-ins at this boundary.
wxlike-platform = { path = "../../crates/platform" }
wxlike-mq = { path = "../../crates/mq" }
axum = { version = "0.8", features = ["macros", "multipart"] }

[lib]
name = "wxlike_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
