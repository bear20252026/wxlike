[package]
name = "wxlike-ui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 客户端协议层（与未来 Flutter/UniFFI 共用）
wxlike-client = { path = "../../crates/client" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
wxlike-core = { path = "../../crates/core" }
wxlike-net = { path = "../../crates/net" }
# 通话引擎：CallHost + str0m 媒体（纯 Rust，无 libwebrtc）
wxlike-rtc = { path = "../../crates/rtc" }
# WP-11: all backend interaction goes through these Rust commands (the
# frontend never speaks HTTP/QUIC itself). ureq = small sync client on rustls.
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
# 秘密聊天设备密钥（静态加密的密钥材料）
rand = "0.8"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
# 真实声卡（cpal + libopus，需要 cmake 构建 vendored opus）。
# 关掉时引擎照常跑，只是听不见声音——CI 与无头环境用默认值。
default = []
audio = ["wxlike-rtc/audio"]

[dev-dependencies]
# command-layer tests drive a REAL in-process server (platform + QUIC hub),
# never a mock — the task book forbids mock stand-ins at this boundary.
wxlike-platform = { path = "../../crates/platform" }
wxlike-mq = { path = "../../crates/mq" }
wxlike-server = { path = "../../server" }
axum = { version = "0.8", features = ["macros", "multipart"] }
ureq = { version = "2", features = ["json"] }

[lib]
name = "wxlike_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
