jobs:
  android:
    name: android
    needs: [select]
    if: needs.select.outputs.mobile == 'true' || needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-android-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: C8 regenerate UniFFI bindings (generated, never hand-edited)
        run: bash crates/ffi/regenerate.sh
      - run: flutter pub get
        working-directory: apps/mobile
      - name: C8 release-mode APK (debug-signed in CI; release job re-signs)
        shell: bash
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-debug-info=build/app/outputs/symbols \
            --obfuscate
        working-directory: apps/mobile
      - name: C8 verify APK, signer and symbols
        shell: bash
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' apps/mobile/pubspec.yaml | head -1)
          python3 ci/jobs/mobile/check_apk.py \
            --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --expected-version "$version" \
            --symbols-dir apps/mobile/build/app/outputs/symbols \
            --output mobile-evidence/android.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/symbols/**
            mobile-evidence/android.json
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios
    needs: [select]
    if: needs.select.outputs.mobile == 'true' || needs.select.outputs.contract == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: C8 iOS project precondition
        id: project
        shell: bash
        run: |
          if [ ! -d apps/mobile/ios ]; then
            echo "::warning::apps/mobile/ios is absent; the iOS compile is a tracked gap and the release job fails closed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: toolchain
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        if: steps.project.outputs.present == 'true'
        with:
          key: ${{ runner.os }}-ios-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # subosito/flutter-action@v2
        if: steps.project.outputs.present == 'true'
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: C8 unsigned iOS compile (signing happens in release)
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          bash crates/ffi/regenerate.sh
          cd apps/mobile
          flutter pub get
          flutter build ios --release --no-codesign
      - name: C8 record gap when the project is absent
        if: steps.project.outputs.present != 'true'
        shell: bash
        run: |
          echo "iOS compile NOT_APPLICABLE: apps/mobile/ios is missing." >&2
          echo "This is tracked as MOBILE-DEVICE-EVIDENCE; release.yml fails while it stays open." >&2
