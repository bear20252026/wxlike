jobs:
  android:
    name: android
    needs: [select]
    if: needs.select.outputs.mobile == 'true' || needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # runner 上 $ANDROID_HOME 实测是空的：不设的话 sdkmanager 那一行会退化成
      # 一条空命令（exit 127），看着像 sdkmanager 坏了。
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          # APK 打三个 ABI，交叉编译就得有三个 android target
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: C8 Android SDK components
        shell: bash
        run: |
          # `flutter.ndkVersion` 是 28.2.13676358（Flutter 3.47 默认）。runner 预装的
          # NDK 比它旧，AGP 会直接报 "NDK not configured"，所以显式装一次——
          # 版本写死在这里，别指望"runner 上应该会有"。
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager 不在 $SDKMANAGER；runner 镜像可能变了，检查 ANDROID_HOME" >&2
            ls "$ANDROID_HOME" >&2 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-android-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: C8 regenerate UniFFI bindings (generated, never hand-edited)
        run: bash crates/ffi/regenerate.sh
      - name: C8 cross-compile libwxlike_ffi.so
        shell: bash
        run: |
          # jniLibs 下的 .so 是 gitignore 的产物。这一步没了，APK 照样打得出来，
          # 但装上就是启动即崩：Dart FFI 找不到 libwxlike_ffi.so。
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o apps/mobile/android/app/src/main/jniLibs \
            build -p wxlike-ffi --release
          # release 产物带符号表，strip 掉能少一半，apk 体积直接受影响。
          # 坑：**不要加 `-type f`**——NDK 里的 llvm-strip 是指向 llvm-strip-18 的
          # 符号链接，`-type f` 会把它们全过滤掉，STRIP 变成空串，下一行就成了
          # "空命令"→ exit 127（本地是 llvm-strip.exe 普通文件，所以本地不暴露）。
          STRIP=$(find "$ANDROID_HOME/ndk" -name 'llvm-strip' 2>/dev/null | sort | tail -1)
          if [ -n "$STRIP" ] && [ -x "$STRIP" ]; then
            for abi in arm64-v8a armeabi-v7a x86_64; do
              so="apps/mobile/android/app/src/main/jniLibs/$abi/libwxlike_ffi.so"
              if [ -f "$so" ]; then
                "$STRIP" --strip-unneeded "$so"
                ls -lh "$so"
              fi
            done
          else
            echo "警告：找不到可执行的 llvm-strip，跳过 strip（apk 会大一些）" >&2
          fi
      - run: flutter pub get
        working-directory: apps/mobile
      - name: C8 generate CI signing keystore
        shell: bash
        run: |
          # CI 专用签名：release 构建必须真正被签名（apksigner 证据面要求
          # 有 signer 证书）。keystore 每次运行现生成，只用于 CI，不是发布密钥；
          # release job 会重签。本地构建无 key.properties 时回退 debug 签名。
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass wxlike-ci -keypass wxlike-ci -alias wxlike-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=wxlike CI, O=wxlike, C=US"
          {
            echo "storeFile=$RUNNER_TEMP/ci-release.jks"
            echo "storePassword=wxlike-ci"
            echo "keyAlias=wxlike-ci"
            echo "keyPassword=wxlike-ci"
          } > apps/mobile/android/key.properties
      - name: C8 release-mode APK (CI-signed; release job re-signs)
        shell: bash
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-debug-info=build/app/outputs/symbols \
            --obfuscate
        working-directory: apps/mobile
      - name: C8 merged manifest keeps INTERNET
        shell: bash
        run: |
          # 合并清单要 `flutter build` 之后才生成，所以只能在构建后校。
          MERGED=$(find apps/mobile/build -name "AndroidManifest.xml" -path "*release*" | head -1)
          if [ -z "$MERGED" ]; then
            echo "::error::构建后仍找不到 release 的合并清单" >&2
            exit 1
          fi
          echo "合并清单：$MERGED"
          grep -q 'android.permission.INTERNET' "$MERGED" || {
            echo "::error::release 合并清单里没有 INTERNET 权限" >&2
            exit 1
          }
      - name: C8 verify APK, signer and symbols
        shell: bash
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' apps/mobile/pubspec.yaml | head -1)
          python3 ci/jobs/mobile/check_apk.py \
            --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --expected-version "$version" \
            --symbols-dir apps/mobile/build/app/outputs/symbols \
            --require-native-lib libwxlike_ffi.so \
            --output mobile-evidence/android.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/symbols/**
            mobile-evidence/android.json
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios
    needs: [select]
    if: needs.select.outputs.mobile == 'true' || needs.select.outputs.contract == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: C8 iOS project precondition
        id: project
        shell: bash
        run: |
          if [ ! -d apps/mobile/ios ]; then
            echo "::warning::apps/mobile/ios is absent; the iOS compile is a tracked gap and the release job fails closed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: toolchain
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        if: steps.project.outputs.present == 'true'
        with:
          key: ${{ runner.os }}-ios-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # subosito/flutter-action@v2
        if: steps.project.outputs.present == 'true'
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: C8 unsigned iOS compile (signing happens in release)
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          bash crates/ffi/regenerate.sh
          cd apps/mobile
          flutter pub get
          flutter build ios --release --no-codesign
      - name: C8 record gap when the project is absent
        if: steps.project.outputs.present != 'true'
        shell: bash
        run: |
          echo "iOS compile NOT_APPLICABLE: apps/mobile/ios is missing." >&2
          echo "This is tracked as MOBILE-DEVICE-EVIDENCE; release.yml fails while it stays open." >&2
