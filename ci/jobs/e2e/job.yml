jobs:
  e2e:
    name: e2e
    needs: [select]
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-e2e-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
      - name: C11 build server
        run: cargo build --locked -p wxlike-server
      - name: C11 e2e, restart recovery and fault suites
        shell: bash
        env:
          WXLIKE_E2E_EVIDENCE: ${{ github.workspace }}/e2e-evidence
        run: bash tests/e2e/ci.sh
      - name: C11 evidence summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"))
          root = Path("e2e-evidence")
          lines = ["### e2e evidence\n\n| suite | result | cases | blocked |\n|---|---|---|---|"]
          for path in sorted(root.glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              cases = data.get("cases", [])
              blocked = [c["name"] for c in cases if c["status"] == "blocked"]
              lines.append(f"| {data.get('suite')} | {'pass' if data.get('ok') else 'fail'} | {len(cases)} | {', '.join(blocked) or '—'} |")
          with out.open("a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidence
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 14
