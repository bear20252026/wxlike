jobs:
  ci-gate:
    name: ci gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit
  security-gate:
    name: security gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
    secrets: inherit
  release:
    name: release
    needs:
    - ci-gate
    - security-gate
    - android-release
    - ios-release
    - desktop-release
    if: always() && needs.ci-gate.result == 'success' && needs.security-gate.result == 'success' && needs.desktop-release.result == 'success'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: resolve and validate version
      id: meta
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PUBLISH: ${{ inputs.publish }}
      run: python3 ci/jobs/release/release_meta.py
    - name: release gate - contract registry must be complete
      run: python3 ci/jobs/contract/check_contracts.py --require-registry
    - name: download android artefacts
      if: needs.android-release.result == 'success'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: android-release
        path: artifacts/android
    - name: download ios artefacts
      if: needs.ios-release.result == 'success'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ios-release
        path: artifacts/ios
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        pattern: desktop-*
        path: artifacts/desktop
    - name: verify desktop signatures and merge manifests
      shell: bash
      env:
        UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        RELEASE_VERSION: ${{ steps.meta.outputs.version }}
      run: "set -euo pipefail\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends minisign\necho \"pubkey is configured: $([ -n \"$UPDATER_PUBKEY\" ] && echo yes || echo no)\"\n[ -n \"$UPDATER_PUBKEY\" ] || { echo \"::error::TAURI_UPDATER_PUBKEY is not configured\"; exit 1; }\npython3 - \"$UPDATER_PUBKEY\" <<'PY'\nimport hashlib, json, os, subprocess, sys\nfrom pathlib import Path\npubkey = sys.argv[1]\nroot = Path(\"artifacts/desktop\")\nmanifests = sorted(root.rglob(\"manifest-*.json\"))\nif len(manifests) < 3:\n    sys.exit(f\"expected 3 desktop manifests, found {manifests}\")\nfor manifest in manifests:\n    data = json.loads(manifest.read_text(encoding=\"utf-8\"))\n    for platform, entry in data[\"platforms\"].items():\n        name = entry[\"url\"].rsplit(\"/\", 1)[-1]\n        matches = [p for p in root.rglob(name) if p.is_file()]\n        if not matches:\n            sys.exit(f\"artefact {name} for {platform} not downloaded\")\n        artifact = matches[0]\n        digest = hashlib.sha256(artifact.read_bytes()).hexdigest()\n        if digest != entry[\"sha256\"]:\n            sys.exit(f\"sha256 mismatch for {artifact}: {digest} != {entry['sha256']}\")\n        signature = artifact.with_name(artifact.name + \".sig\")\n        if not signature.is_file():\n            sys.exit(f\"signature missing for {artifact}\")\n        result = subprocess.run(\n            [\"minisign\", \"-V\", \"-m\", str(artifact), \"-x\", str(signature), \"-P\", pubkey],\n            capture_output=True, text=True,\n        )\n        if result.returncode != 0:\n            sys.exit(f\"signature rejected for {artifact}: {result.stderr}\")\n        print(f\"verified {platform}: {name}\")\nPY\npython3 ci/jobs/desktop/make_update_manifest.py \\\n  --merge $(find artifacts/desktop -name 'manifest-*.json' | sort) \\\n  --require-signature \\\n  --output release-evidence/latest.json\npython3 - \"$RELEASE_VERSION\" <<'PY'\nimport json, sys\nfrom pathlib import Path\ndata = json.loads(Path(\"release-evidence/latest.json\").read_text(encoding=\"utf-8\"))\nif data.get(\"version\") != sys.argv[1]:\n    sys.exit(f\"desktop version {data.get('version')} != release {sys.argv[1]}\")\nPY\n"
    - name: validate mobile and device evidence
      if: needs.android-release.result == 'success' && needs.ios-release.result == 'success'
      shell: bash
      run: "set -euo pipefail\nandroid=$(find artifacts/android -name 'android-release.json' | head -1)\nios=$(find artifacts/ios -name 'ios-release.json' | head -1)\npython3 - \"$android\" \"$ios\" <<'PY'\nimport json, sys\nfrom pathlib import Path\nfor path, label in ((sys.argv[1], \"android\"), (sys.argv[2], \"ios\")):\n    data = json.loads(Path(path).read_text(encoding=\"utf-8\"))\n    if not data.get(\"sha256\"):\n        sys.exit(f\"{label} evidence has no artifact hash\")\n    print(f\"{label}: {data.get('artifact')} sha256={data['sha256']} signer={data.get('signer') or data.get('authority')}\")\nPY\nverified=0\nif [ -f deploy/signing-docs/device-evidence.json ]; then\n  python3 ci/jobs/mobile/check_device_evidence.py \\\n    --evidence deploy/signing-docs/device-evidence.json \\\n    --matrix deploy/signing-docs/device-matrix.json \\\n    --release-evidence \"$android\"\n  verified=1\nelse\n  echo \"::warning::no real-device evidence; publication will be blocked\"\nfi\necho \"DEVICE_VERIFIED=$verified\" >> \"$GITHUB_ENV\"\ncp \"$android\" release-evidence/android-release.json\ncp \"$ios\" release-evidence/ios-release.json\n"
    - name: record known gaps (release fails while any blocks_release gap is open)
      shell: bash
      run: python3 ci/jobs/build/check_gaps.py --release --json release-evidence/gaps.json
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: login to GHCR
      if: steps.meta.outputs.publish == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: build server image
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: containers/server/Dockerfile
        push: ${{ steps.meta.outputs.publish == 'true' }}
        load: ${{ steps.meta.outputs.publish != 'true' }}
        tags: '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

          ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

          '
        labels: 'org.opencontainers.image.revision=${{ github.sha }}

          org.opencontainers.image.version=${{ steps.meta.outputs.version }}

          '
    - name: publish digest reference
      id: digest
      shell: bash
      env:
        BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        PUBLISH: ${{ steps.meta.outputs.publish }}
        IMAGE: ${{ steps.meta.outputs.image }}
        RELEASE_VERSION: ${{ steps.meta.outputs.version }}
      run: "if [ \"$PUBLISH\" = \"true\" ]; then\n  echo \"digest=$BUILT_DIGEST\" >> \"$GITHUB_OUTPUT\"\n  echo \"ref=$IMAGE@$BUILT_DIGEST\" >> \"$GITHUB_OUTPUT\"\nelse\n  local_id=$(docker image inspect -f '{{.Id}}' \"$IMAGE:$RELEASE_VERSION\")\n  echo \"digest=$local_id\" >> \"$GITHUB_OUTPUT\"\n  echo \"ref=$local_id\" >> \"$GITHUB_OUTPUT\"\n  echo \"dry run: local image $local_id (not published)\"\nfi\n"
    - name: SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        image: ${{ steps.meta.outputs.publish == 'true' && format('{0}@{1}', steps.meta.outputs.image, steps.build.outputs.digest) || format('{0}:{1}', steps.meta.outputs.image, steps.meta.outputs.version) }}
        format: spdx-json
        output-file: release-evidence/server-sbom.spdx.json
        upload-artifact: false
    - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      if: steps.meta.outputs.publish == 'true'
    - name: sign image and verify the signature
      if: steps.meta.outputs.publish == 'true'
      shell: bash
      run: "set -euo pipefail\nref=\"${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}\"\ncosign sign --yes \"$ref\"\ncosign verify \"$ref\" \\\n  --certificate-identity-regexp \"^https://github.com/${GITHUB_REPOSITORY}/\" \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n"
    - name: attest build provenance
      if: steps.meta.outputs.publish == 'true'
      uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
      with:
        subject-name: ${{ steps.meta.outputs.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
    - name: assemble release manifest
      shell: bash
      env:
        RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        PUBLISH: ${{ steps.meta.outputs.publish }}
      run: "set -euo pipefail\nargs=(\n  --version \"$RELEASE_VERSION\"\n  --commit \"${{ github.sha }}\"\n  --image \"${{ steps.meta.outputs.image }}\"\n  --image-digest \"${{ steps.digest.outputs.digest }}\"\n  --gaps-json release-evidence/gaps.json\n  --desktop-manifest release-evidence/latest.json\n  --output release-evidence/release-manifest.json\n)\n[ -f release-evidence/server-sbom.spdx.json ] && args+=(--sbom release-evidence/server-sbom.spdx.json)\n[ -f release-evidence/android-release.json ] && args+=(--android-evidence release-evidence/android-release.json)\n[ -f release-evidence/ios-release.json ] && args+=(--ios-evidence release-evidence/ios-release.json)\n[ -f deploy/signing-docs/device-evidence.json ] && args+=(--device-evidence deploy/signing-docs/device-evidence.json)\n[ \"${DEVICE_VERIFIED:-0}\" = \"1\" ] && args+=(--device-evidence-verified)\n[ \"$PUBLISH\" = \"true\" ] && args+=(--published --require-clean)\npython3 ci/jobs/release/make_release_manifest.py \"${args[@]}\"\n"
    - name: publish GitHub release
      if: steps.meta.outputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ steps.meta.outputs.version }}
      run: "set -euo pipefail\ntag=\"v$RELEASE_VERSION\"\nmapfile -t assets < <(find artifacts release-evidence -type f \\( \\\n  -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name '*.deb' -o -name '*.AppImage' \\\n  -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' \\\n  -o -name 'release-manifest.json' -o -name 'server-sbom.spdx.json' -o -name 'latest.json' \\) | sort)\nif gh release view \"$tag\" >/dev/null 2>&1; then\n  gh release upload \"$tag\" \"${assets[@]}\" --clobber\nelse\n  gh release create \"$tag\" \"${assets[@]}\" --target \"$GITHUB_SHA\" --title \"wxlike $RELEASE_VERSION\" --generate-notes\nfi\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: release-evidence
        path: release-evidence/
        if-no-files-found: warn
        retention-days: 90
