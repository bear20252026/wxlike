name: ci
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTDOCFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: 1.97.1
  WXLIKE_CI: '1'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      contract: ${{ steps.select.outputs.contract }}
      ui: ${{ steps.select.outputs.ui }}
      mobile: ${{ steps.select.outputs.mobile }}
      desktop: ${{ steps.select.outputs.desktop }}
      ci: ${{ steps.select.outputs.ci }}
      full: ${{ steps.select.outputs.full }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: C0 classify changed paths
      id: select
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: "set -euo pipefail\nif [ -z \"${BASE_SHA:-}\" ] || [ \"${BASE_SHA:-}\" = \"0000000000000000000000000000000000000000\" ]; then\n  echo \"no usable base sha; forcing the full matrix\"\n  python3 ci/jobs/build/select_targets.py --changed-file \"unclassified/first-run\" --github-output \"$GITHUB_OUTPUT\"\nelse\n  python3 ci/jobs/build/select_targets.py --base \"$BASE_SHA\" --head \"$HEAD_SHA\" --github-output \"$GITHUB_OUTPUT\"\nfi\n"
  fmt:
    name: fmt
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - run: cargo fmt --check
  clippy:
    name: clippy
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    name: test (${{ matrix.os }})
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - run: cargo test --workspace --locked
  native:
    name: native (${{ matrix.os }})
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-native-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - run: cargo build --workspace --all-targets --locked
  doc:
    name: doc
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-doc-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - run: cargo doc --no-deps --workspace --locked
  wasm:
    name: wasm
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - name: C6 wasm compile (gap-aware)
      run: python3 ci/jobs/build/check_wasm.py
    - name: record known gaps
      run: python3 ci/jobs/build/check_gaps.py
  ui:
    name: ui
    needs:
    - select
    if: needs.select.outputs.ui == 'true' || needs.select.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
      working-directory: ui
    - name: C7 typecheck
      run: npm run typecheck
      working-directory: ui
    - name: C7 bundle
      run: npm run build
      working-directory: ui
    - name: C7 wire bincode selftest
      run: npm run test:wire
      working-directory: ui
    - name: C7 message index contract
      run: npm run check:msgindex
      working-directory: ui
  flutter:
    name: flutter
    needs:
    - select
    if: needs.select.outputs.mobile == 'true' || needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-flutter-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.47.0
        channel: stable
        cache: true
    - name: C8 regenerate UniFFI bindings (generated, never hand-edited)
      run: bash crates/ffi/regenerate.sh
    - name: C8 pub get
      run: flutter pub get
      working-directory: apps/mobile
    - name: C8 analyze
      run: flutter analyze
      working-directory: apps/mobile
    - name: C8 test
      run: flutter test
      working-directory: apps/mobile
  web-v2:
    name: web-v2
    needs:
    - select
    if: needs.select.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/desktop-web/package-lock.json
    - name: C7b install (apps/desktop-web)
      run: npm ci
      working-directory: apps/desktop-web
    - name: C7b typecheck
      run: npm run typecheck
      working-directory: apps/desktop-web
    - name: C7b lint
      run: npm run --if-present lint
      working-directory: apps/desktop-web
    - name: C7b production build
      run: npm run build
      working-directory: apps/desktop-web
    - name: C7b unit tests
      run: npm test
      working-directory: apps/desktop-web
    - name: C7b mini-sdk contract parity (packages/mini-sdk, no deps to install)
      run: npm test
      working-directory: packages/mini-sdk
  contract:
    name: contract
    needs:
    - select
    if: needs.select.outputs.contract == 'true' || needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: C4 contract structure, seed and registry
      run: python3 ci/jobs/contract/check_contracts.py
    - name: C4 bincode variant order (Rust vs browser)
      run: python3 ci/jobs/contract/check_wire_variants.py
    - name: C4 report known gaps
      run: python3 ci/jobs/build/check_gaps.py
  audit:
    name: audit
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - name: install CI tooling
      run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
      with:
        tool: typos-cli,cargo-deny,cargo-audit
    - name: C10 quality metrics (only worse is red)
      run: python scripts/quality-gate.py
    - name: C10 typos
      run: typos
    - name: C10 advisory / ban / source policy
      run: cargo deny check advisories bans sources
    - name: C10 root lock is closed
      run: cargo metadata --locked --format-version 1 > /dev/null
    - name: C10 desktop lock is closed
      run: cargo metadata --locked --format-version 1 > /dev/null
      working-directory: ui/src-tauri
    - name: C10 root advisory audit
      run: cargo audit
    - name: C10 desktop advisory audit
      run: cargo audit
      working-directory: ui/src-tauri
    - name: C10 action pins and workflow policy
      run: 'python ci/jobs/audit/check_pins.py --workflow ci/jobs/generated/ci.yml --workflow ci/jobs/generated/release.yml --pins-only

        python ci/jobs/audit/check_pins.py --workflow ci/jobs/generated/ci.yml --workflow ci/jobs/generated/release.yml

        '
    - name: C10 composed workflows match the checked-in fragments and the live .github/
      run: python ci/jobs/compose.py --check --check-live
    - name: C10 CI-of-CI unit tests
      run: python -m unittest discover -s ci/jobs/tests
  coverage:
    name: coverage
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-coverage-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
      with:
        tool: cargo-llvm-cov
    - name: C11 measure (blocking)
      run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
    - name: C11 incremental security-path gate
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: "set -euo pipefail\nif [ -z \"${CI_BASE_SHA:-}\" ] || [ \"${CI_BASE_SHA:-}\" = \"0000000000000000000000000000000000000000\" ]; then\n  echo \"no base sha: security-path diff cannot be measured\" >&2\n  exit 1\nfi\npython ci/jobs/build/check_coverage.py --lcov lcov.info\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: coverage-lcov
        path: lcov.info
        if-no-files-found: warn
  unwrap:
    name: unwrap
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: C11 repository baseline may only go down
      run: python scripts/count_unwraps.py --fail-on-increase --details
    - name: C11 no new unwrap/expect in critical paths
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: "set -euo pipefail\nif [ -z \"${CI_BASE_SHA:-}\" ] || [ \"${CI_BASE_SHA:-}\" = \"0000000000000000000000000000000000000000\" ]; then\n  echo \"no base sha: added-line scan cannot be measured\" >&2\n  exit 1\nfi\npython ci/jobs/build/check_added_unwraps.py\n"
  gate:
    name: gate
    needs:
    - select
    - fmt
    - clippy
    - test
    - native
    - doc
    - wasm
    - contract
    - ui
    - web-v2
    - flutter
    - audit
    - coverage
    - unwrap
    - desktop
    - desktop-package
    - image
    - android
    - ios
    - e2e
    - performance
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: C0-C11 gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: python ci/jobs/build/gate.py
    - name: report known gaps (non-blocking daily; release blocks)
      run: python ci/jobs/build/check_gaps.py
  image:
    name: image
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: C9 build server image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: containers/server/Dockerfile
        load: true
        tags: wxlike-server:ci
        build-args: 'GIT_REVISION=${{ github.sha }}

          WXLIKE_VERSION=0.1.0

          '
        cache-from: type=gha,scope=server-image
        cache-to: type=gha,mode=max,scope=server-image
    - name: C9 non-root/read-only/secret checks
      run: bash containers/server/verify-image.sh wxlike-server:ci
    - name: C9 start -> login -> send -> restart recovery
      env:
        WXLIKE_SMOKE_EVIDENCE: ${{ github.workspace }}/.smoke-evidence
      run: bash containers/server/smoke.sh wxlike-server:ci
    - name: C9 image SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        image: wxlike-server:ci
        format: spdx-json
        output-file: wxlike-server.spdx.json
        upload-artifact: false
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: server-image-evidence
        path: 'wxlike-server.spdx.json

          .smoke-evidence/

          '
        if-no-files-found: error
  ingest-image:
    name: ingest-image
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: C9 build live-ingest image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: containers/live-ingest/Dockerfile
        load: true
        tags: wxlike-live-ingest:ci
        build-args: GIT_REVISION=${{ github.sha }}
        cache-from: type=gha,scope=ingest-image
        cache-to: type=gha,mode=max,scope=ingest-image
    - name: C9 FFmpeg version, licence and NOTICE
      run: bash ci/jobs/server/check_ffmpeg_notice.sh wxlike-live-ingest:ci
  android:
    name: android
    needs:
    - select
    if: needs.select.outputs.mobile == 'true' || needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        # APK 打三个 ABI，交叉编译就得有三个 android target

        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

        '
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
      with:
        tool: cargo-ndk
    - name: C8 Android SDK components
      shell: bash
      run: "# `flutter.ndkVersion` 是 28.2.13676358（Flutter 3.47 默认）。runner 预装的\n# NDK 比它旧，AGP 会直接报 \"NDK not configured\"，所以显式装一次——\n# 版本写死在这里，别指望\"runner 上应该会有\"。\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\nif [ ! -x \"$SDKMANAGER\" ]; then\n  echo \"::error::sdkmanager 不在 $SDKMANAGER；runner 镜像可能变了，检查 ANDROID_HOME\" >&2\n  ls \"$ANDROID_HOME\" >&2 || true\n  exit 1\nfi\nyes | \"$SDKMANAGER\" --licenses > /dev/null 2>&1 || true\n\"$SDKMANAGER\" --install \\\n  \"ndk;28.2.13676358\" \"platforms;android-36\" \"build-tools;36.0.0\" > /dev/null\n"
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-android-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.47.0
        channel: stable
        cache: true
    - name: C8 regenerate UniFFI bindings (generated, never hand-edited)
      run: bash crates/ffi/regenerate.sh
    - name: C8 cross-compile libwxlike_ffi.so
      shell: bash
      run: "# jniLibs 下的 .so 是 gitignore 的产物。这一步没了，APK 照样打得出来，\n# 但装上就是启动即崩：Dart FFI 找不到 libwxlike_ffi.so。\ncargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \\\n  -o apps/mobile/android/app/src/main/jniLibs \\\n  build -p wxlike-ffi --release\n# release 产物带符号表，strip 掉能少一半，apk 体积直接受影响。\n# 坑：**不要加 `-type f`**——NDK 里的 llvm-strip 是指向 llvm-strip-18 的\n# 符号链接，`-type f` 会把它们全过滤掉，STRIP 变成空串，下一行就成了\n# \"空命令\"→ exit 127（本地是 llvm-strip.exe 普通文件，所以本地不暴露）。\nSTRIP=$(find \"$ANDROID_HOME/ndk\" -name 'llvm-strip' 2>/dev/null | sort | tail -1)\nif [ -n \"$STRIP\" ] && [ -x \"$STRIP\" ]; then\n  for abi in arm64-v8a armeabi-v7a x86_64; do\n    so=\"apps/mobile/android/app/src/main/jniLibs/$abi/libwxlike_ffi.so\"\n    if [ -f \"$so\" ]; then\n      \"$STRIP\" --strip-unneeded \"$so\"\n      ls -lh \"$so\"\n    fi\n  done\nelse\n  echo \"警告：找不到可执行的 llvm-strip，跳过 strip（apk 会大一些）\" >&2\nfi\n"
    - run: flutter pub get
      working-directory: apps/mobile
    - name: C8 generate CI signing keystore
      shell: bash
      run: "# CI 专用签名：release 构建必须真正被签名（apksigner 证据面要求\n# 有 signer 证书）。keystore 每次运行现生成，只用于 CI，不是发布密钥；\n# release job 会重签。本地构建无 key.properties 时回退 debug 签名。\nkeytool -genkeypair -v \\\n  -keystore \"$RUNNER_TEMP/ci-release.jks\" \\\n  -storepass wxlike-ci -keypass wxlike-ci -alias wxlike-ci \\\n  -keyalg RSA -keysize 2048 -validity 10000 \\\n  -dname \"CN=wxlike CI, O=wxlike, C=US\"\n{\n  echo \"storeFile=$RUNNER_TEMP/ci-release.jks\"\n  echo \"storePassword=wxlike-ci\"\n  echo \"keyAlias=wxlike-ci\"\n  echo \"keyPassword=wxlike-ci\"\n} > apps/mobile/android/key.properties\n"
    - name: C8 release-mode APK (CI-signed; release job re-signs)
      shell: bash
      run: "flutter build apk --release \\\n  --target-platform android-arm,android-arm64,android-x64 \\\n  --split-debug-info=build/app/outputs/symbols \\\n  --obfuscate\n"
      working-directory: apps/mobile
    - name: C8 merged manifest keeps INTERNET
      shell: bash
      run: "# 合并清单要 `flutter build` 之后才生成，所以只能在构建后校。\n# **只看 app 模块自己的清单**：每个 library 模块（jni、jni_flutter 等）在\n# `build/<plugin>/intermediates/**/release/` 下也各生成一份合并清单，而\n# 它们的清单里本来就没有 INTERNET。原来写的是\n# `find apps/mobile/build -name AndroidManifest.xml -path \"*release*\" | head -1`\n# —— 按目录顺序撞上谁算谁，#303 就是这么假红的：APK 65.8MB 正常构建、\n# 权限也没丢，检查却读到插件模块的清单。本机一次真实构建里这样的候选有\n# 8 个、其中 4 个没有 INTERNET ⇒ 这条门禁等于一半概率掷硬币。\nMERGED=\"\"\nfor cand in \\\n  apps/mobile/build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml \\\n  apps/mobile/build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml \\\n  apps/mobile/build/app/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml; do\n  if [ -f \"$cand\" ]; then MERGED=\"$cand\"; break; fi\ndone\nif [ -z \"$MERGED\" ]; then\n  # AGP 改目录名时的兜底：搜索范围锁死在 app 模块内，绝不碰 library 模块。\n  MERGED=$(find apps/mobile/build/app/intermediates -path \"*release*\" -name \"AndroidManifest.xml\" 2>/dev/null | sort | head -1)\nfi\nif [ -z \"$MERGED\" ]; then\n  echo \"::error::构建后仍找不到 app 模块 release 的合并清单\" >&2\n  exit 1\nfi\necho \"合并清单：$MERGED\"\ngrep -q 'android.permission.INTERNET' \"$MERGED\" || {\n  echo \"::error::app 模块 release 合并清单里没有 INTERNET 权限\" >&2\n  exit 1\n}\n"
    - name: C8 verify APK, signer and symbols
      shell: bash
      run: "version=$(sed -n 's/^version: *\\([^+]*\\).*/\\1/p' apps/mobile/pubspec.yaml | head -1)\npython3 ci/jobs/mobile/check_apk.py \\\n  --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk \\\n  --expected-version \"$version\" \\\n  --symbols-dir apps/mobile/build/app/outputs/symbols \\\n  --require-native-lib libwxlike_ffi.so \\\n  --output mobile-evidence/android.json\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: android-unsigned
        path: 'apps/mobile/build/app/outputs/flutter-apk/app-release.apk

          apps/mobile/build/app/outputs/symbols/**

          mobile-evidence/android.json

          '
        if-no-files-found: error
        retention-days: 14
  ios:
    name: ios
    needs:
    - select
    if: needs.select.outputs.mobile == 'true' || needs.select.outputs.contract == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: C8 iOS project precondition
      id: project
      shell: bash
      run: "if [ ! -d apps/mobile/ios ]; then\n  echo \"::warning::apps/mobile/ios is absent; the iOS compile is a tracked gap and the release job fails closed.\"\n  echo \"present=false\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"present=true\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: toolchain
      if: steps.project.outputs.present == 'true'
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      if: steps.project.outputs.present == 'true'
      with:
        key: ${{ runner.os }}-ios-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      if: steps.project.outputs.present == 'true'
      with:
        flutter-version: 3.47.0
        channel: stable
        cache: true
    - name: C8 unsigned iOS compile (signing happens in release)
      if: steps.project.outputs.present == 'true'
      shell: bash
      run: 'bash crates/ffi/regenerate.sh

        cd apps/mobile

        flutter pub get

        flutter build ios --release --no-codesign

        '
    - name: C8 record gap when the project is absent
      if: steps.project.outputs.present != 'true'
      shell: bash
      run: 'echo "iOS compile NOT_APPLICABLE: apps/mobile/ios is missing." >&2

        echo "This is tracked as MOBILE-DEVICE-EVIDENCE; release.yml fails while it stays open." >&2

        '
  desktop:
    name: desktop
    needs:
    - select
    if: needs.select.outputs.desktop == 'true' || needs.select.outputs.ui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: 'ui/package-lock.json

          apps/desktop-web/package-lock.json

          '
    - name: webkit build dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-desktop-${{ hashFiles('ui/src-tauri/Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
        workspaces: ui/src-tauri
    - run: npm ci
      working-directory: ui
    - name: C9 frontend bundle consumed by Tauri
      run: npm run build
      working-directory: ui
    - name: C9 new UI bundle consumed by the default host
      shell: bash
      run: '# 默认宿主的 frontendDist 指向 apps/desktop-web/dist，而 dist 不入库：

        # 少了这一段，安装包会打出一个指向空目录的壳。

        npm ci

        npm run build

        npm run check:host

        '
      working-directory: apps/desktop-web
    - name: C9 Tauri command tests
      run: cargo test --locked --manifest-path ui/src-tauri/Cargo.toml
    - name: C9 updater signature negative test
      shell: bash
      run: 'sudo apt-get install -y --no-install-recommends minisign

        python3 ci/jobs/desktop/check_updater.py --self-test

        '
  desktop-package:
    name: desktop-package (${{ matrix.platform }})
    needs:
    - select
    - desktop
    if: needs.select.outputs.desktop == 'true' || needs.select.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux
          bundles: deb,appimage
        - os: windows-latest
          platform: windows
          bundles: nsis,msi
        - os: macos-latest
          platform: macos-aarch64
          bundles: app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: 'ui/package-lock.json

          apps/desktop-web/package-lock.json

          '
    - name: Linux webkit build dependencies
      if: runner.os == 'Linux'
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-desktop-package-${{ hashFiles('ui/src-tauri/Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
        workspaces: ui/src-tauri
    - run: npm ci
      working-directory: ui
    - name: C9 frontend bundle consumed by Tauri
      run: npm run build
      working-directory: ui
    - name: C9 new UI bundle consumed by the default host
      shell: bash
      run: '# 同上：安装包必须带上默认宿主真正装载的那份产物。

        npm ci

        npm run build

        npm run check:host

        '
      working-directory: apps/desktop-web
    - name: C9 bundle installers (unsigned in CI, signed by the release job)
      shell: bash
      run: "npx --yes @tauri-apps/cli@2.9.0 build --ci \\\n  --config \"$GITHUB_WORKSPACE/ci/jobs/desktop/tauri.bundle.override.json\" \\\n  --bundles \"${{ matrix.bundles }}\"\n"
      working-directory: ui
    - name: read packaged version
      id: version
      shell: bash
      run: 'version=$(python3 -c "import json;print(json.load(open(''ui/src-tauri/tauri.conf.json''))[''version''])")

        echo "version=$version" >> "$GITHUB_OUTPUT"

        echo "packaged wxlike $version"

        '
    - name: updater manifest (unsigned, never publishable until the release job signs it)
      shell: bash
      run: "python3 ci/jobs/desktop/make_update_manifest.py \\\n  --artifacts-dir ui/src-tauri/target/release/bundle \\\n  --platform \"${{ matrix.platform }}\" \\\n  --version \"${{ steps.version.outputs.version }}\" \\\n  --base-url \"https://downloads.wxlike.dev/desktop/v${{ steps.version.outputs.version }}\" \\\n  --output \"desktop-artifacts/manifest-${{ matrix.platform }}.json\"\n"
    - name: C9 packaging evidence
      shell: bash
      run: "python3 - \"$GITHUB_STEP_SUMMARY\" <<'PY'\nimport json, sys\nfrom pathlib import Path\nmanifest = next(Path(\"desktop-artifacts\").glob(\"manifest-*.json\"))\ndata = json.loads(manifest.read_text(encoding=\"utf-8\"))\nwith open(sys.argv[1], \"a\", encoding=\"utf-8\") as fh:\n    fh.write(\"### desktop package\\n\\n\")\n    for platform, entry in data[\"platforms\"].items():\n        fh.write(f\"- `{platform}`: {entry['size']} bytes, sha256 `{entry['sha256']}`\\n\")\n    if not any(\"signature\" in entry for entry in data[\"platforms\"].values()):\n        fh.write(\"\\nUnsigned CI artefact. The release job must sign and re-index it before publication.\\n\")\nPY\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-${{ matrix.platform }}
        path: 'ui/src-tauri/target/release/bundle/**

          desktop-artifacts/manifest-*.json

          '
        if-no-files-found: error
        retention-days: 14
  e2e:
    name: e2e
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-e2e-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - name: C11 build server
      run: cargo build --locked -p wxlike-server
    - name: C11 e2e, restart recovery and fault suites
      shell: bash
      env:
        WXLIKE_E2E_EVIDENCE: ${{ github.workspace }}/e2e-evidence
      run: bash tests/e2e/ci.sh
    - name: C11 evidence summary
      if: always()
      shell: bash
      run: "python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\nout = Path(os.environ.get(\"GITHUB_STEP_SUMMARY\", \"/dev/null\"))\nroot = Path(\"e2e-evidence\")\nlines = [\"### e2e evidence\\n\\n| suite | result | cases | blocked |\\n|---|---|---|---|\"]\nfor path in sorted(root.glob(\"*.json\")):\n    data = json.loads(path.read_text(encoding=\"utf-8\"))\n    cases = data.get(\"cases\", [])\n    blocked = [c[\"name\"] for c in cases if c[\"status\"] == \"blocked\"]\n    lines.append(f\"| {data.get('suite')} | {'pass' if data.get('ok') else 'fail'} | {len(cases)} | {', '.join(blocked) or '—'} |\")\nwith out.open(\"a\", encoding=\"utf-8\") as fh:\n    fh.write(\"\\n\".join(lines) + \"\\n\")\nPY\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: e2e-evidence
        path: e2e-evidence/
        if-no-files-found: warn
        retention-days: 14
  performance:
    name: performance
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        key: ${{ runner.os }}-perf-${{ hashFiles('Cargo.lock') }}-${{ env.RUSTUP_TOOLCHAIN }}
    - name: C11 build server
      run: cargo build --locked -p wxlike-server
    - name: C11 measured load against budgets
      run: "python3 tests/perf/run.py \\\n  --server-bin target/debug/wxlike-server \\\n  --budgets ci/jobs/performance/budgets.json \\\n  --evidence-dir performance-evidence\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: performance-evidence
        path: performance-evidence/
        if-no-files-found: warn
        retention-days: 14
