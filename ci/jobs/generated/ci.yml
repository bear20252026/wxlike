      with:
        flutter-version: 3.47.0
        channel: stable
        cache: false
    - name: C8 unsigned iOS compile (signing happens in release)
      if: steps.project.outputs.present == 'true'
      shell: bash
      run: 'bash crates/ffi/regenerate.sh

        cd apps/mobile

        flutter pub get

        flutter build ios --release --no-codesign

        '
    - name: C8 record gap when the project is absent
      if: steps.project.outputs.present != 'true'
      shell: bash
      run: 'echo "iOS compile NOT_APPLICABLE: apps/mobile/ios is missing." >&2

        echo "This is tracked as MOBILE-DEVICE-EVIDENCE; open, but no longer release-blocking since 2026-11-05." >&2

        '
  desktop:
    name: desktop
    needs:
