name: ci
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTDOCFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: 1.97.1
  WXLIKE_CI: '1'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      contract: ${{ steps.select.outputs.contract }}
      ui: ${{ steps.select.outputs.ui }}
      mobile: ${{ steps.select.outputs.mobile }}
      desktop: ${{ steps.select.outputs.desktop }}
      ci: ${{ steps.select.outputs.ci }}
      full: ${{ steps.select.outputs.full }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: C0 classify changed paths
      id: select
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: "set -euo pipefail\nif [ -z \"${BASE_SHA:-}\" ] || [ \"${BASE_SHA:-}\" = \"0000000000000000000000000000000000000000\" ]; then\n  echo \"no usable base sha; forcing the full matrix\"\n  python3 ci/jobs/build/select_targets.py --changed-file \"unclassified/first-run\" --github-output \"$GITHUB_OUTPUT\"\nelse\n  python3 ci/jobs/build/select_targets.py --base \"$BASE_SHA\" --head \"$HEAD_SHA\" --github-output \"$GITHUB_OUTPUT\"\nfi\n"
  fmt:
    name: fmt
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - run: cargo fmt --check
    - name: Platform surface budget
      run: python3 scripts/platform_surface_audit.py --max-pub 0 --check-facades
  clippy:
    name: clippy
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    name: test (${{ matrix.os }})
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        add-rust-environment-hash-key: false
        key: ${{ runner.os }}-test-${{ env.RUSTUP_TOOLCHAIN }}
    - run: cargo test --workspace --locked
  native:
    name: native (${{ matrix.os }})
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        add-rust-environment-hash-key: false
        key: ${{ runner.os }}-native-${{ env.RUSTUP_TOOLCHAIN }}
    - run: cargo build --workspace --all-targets --locked
  doc:
    name: doc
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - run: cargo doc --no-deps --workspace --locked
  wasm:
    name: wasm
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - name: C6 wasm compile (gap-aware)
      run: python3 ci/jobs/build/check_wasm.py
    - name: install wasm-pack (pinned)
      shell: bash
      run: "curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \\\n  | tar -xz -C /tmp\nsudo install /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack\nwasm-pack --version\n"
    - name: C6 wasm package (G01-03 JS packaging)
      run: bash scripts/build-wasm.sh
    - name: record known gaps
      run: python3 ci/jobs/build/check_gaps.py
  wasm-browser:
    name: wasm-browser
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        rustup target add wasm32-unknown-unknown

        '
    - name: install wasm-pack (pinned)
      shell: bash
      run: "curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \\\n  | tar -xz -C /tmp\nsudo install /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack\nwasm-pack --version\n"
    - name: chromedriver
      shell: bash
      run: "set -euo pipefail\nif ! command -v chromedriver >/dev/null 2>&1; then\n  sudo apt-get update\n  sudo apt-get install -y chromedriver\nfi\nchromedriver --version\ngoogle-chrome --version\n"
    - name: C6 wasm browser acceptance (G01-03)
      shell: bash
      run: wasm-pack test --headless --chrome crates/client-web
    - name: record known gaps
      run: python3 ci/jobs/build/check_gaps.py
  ui:
    name: ui (old-UI retirement guard)
    needs:
    - select
    if: needs.select.outputs.ui == 'true' || needs.select.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: old-UI retirement guard
      run: python3 ci/jobs/tests/test_ci.py OldUiRetirementTest
    - name: host config guard
      run: node scripts/check-tauri-host.mjs
  flutter:
    name: flutter
    needs:
    - select
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.47.0
        channel: stable
        cache: false
    - name: C8 regenerate UniFFI bindings (generated, never hand-edited)
      run: bash crates/ffi/regenerate.sh
    - name: C8 pub get
      run: flutter pub get
      working-directory: apps/mobile
    - name: C8 analyze
      run: flutter analyze
      working-directory: apps/mobile
    - name: C8 test
      run: flutter test
      working-directory: apps/mobile
  pg-migration:
    name: pg-migration
    needs:
    - select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:19.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wxlike
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d wxlike" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wxlike
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: 等 PostgreSQL 就绪
      shell: bash
      run: "set -euo pipefail\nfor _ in $(seq 1 30); do\n  if pg_isready -h localhost -p 5432 -U postgres -d wxlike >/dev/null 2>&1; then\n    exit 0\n  fi\n  sleep 2\ndone\necho \"postgres did not become ready\" >&2\nexit 1\n"
    - name: M010 DDL 首次执行
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/proposals/G06/0001_ledger_commerce.sql
    - name: M010 DDL 重跑（幂等/可重入）
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/proposals/G06/0001_ledger_commerce.sql
    - name: M011-M016 DDL 首次 + 重跑（幂等）
      shell: bash
      run: "set -euo pipefail\nfor f in \\\n  schema/proposals/G02/0002_identity_pg_compat.sql \\\n  schema/proposals/G04/0002_media_pg_compat.sql \\\n  schema/proposals/G06/0002_ledger_wallets_backfill.sql \\\n  schema/proposals/G05/0003_content_pg_compat.sql \\\n  schema/proposals/G02/0003_identity_retry.sql \\\n  schema/proposals/G02/0004_identity_session_meta.sql; do\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$f\"\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$f\"\ndone\n"
    - name: M017 前写入旧侧车 fixture
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_m017_backfill_fixture.sql
    - name: M017 DDL 首次 + 重跑（幂等 + 回填）
      shell: bash
      run: "set -euo pipefail\nfor _ in 1 2; do\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 \\\n    -f schema/proposals/G02/0005_identity_session_meta.sql\ndone\n"
    - name: M018 侧车清理触发器首次 + 重跑（幂等）
      shell: bash
      run: "set -euo pipefail\nfor _ in 1 2; do\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 \\\n    -f schema/proposals/G02/0006_identity_session_meta_cleanup.sql\ndone\n"
    - name: M019-M022 消息/关系/序列号首次 + 重跑（幂等）
      shell: bash
      run: "set -euo pipefail\nfor f in \\\n  schema/proposals/G03/0001_message_timeline.sql \\\n  schema/proposals/G03/0002_message_delivery.sql \\\n  schema/proposals/G02/0007_relations_acs.sql \\\n  schema/proposals/G02/0008_identity_token_serial.sql; do\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$f\"\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$f\"\ndone\n"
    - name: M023 割接导入控制表首次 + 重跑（幂等）
      shell: bash
      run: "set -euo pipefail\nfor _ in 1 2; do\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 \\\n    -f schema/proposals/G00/0001_import_control.sql\ndone\n"
    - name: M024 全量导入兼容补齐首次 + 重跑（幂等）
      shell: bash
      run: "set -euo pipefail\nfor _ in 1 2; do\n  psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 \\\n    -f schema/proposals/G00/0002_import_compat_backfill.sql\ndone\n"
    - name: M010 schema/触发器/不可变性断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts.sql
    - name: M011-M013 兼容层与回填断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_compat.sql
    - name: M014 内容/工单表断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_content.sql
    - name: M015 identity_retry 断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_retry.sql
    - name: M016 identity 会话侧车列断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_session_meta.sql
    - name: M017 identity 会话侧车表断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_session_meta_table.sql
    - name: M018 identity 会话侧车清理断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_session_meta_cleanup.sql
    - name: M019-M022 消息/关系/序列号形状断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_g03.sql
    - name: M019-M022 默认值/唯一约束行为冒烟
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_m019_m022_behavior.sql
    - name: M023 导入控制表形状/约束断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_import.sql
    - name: M024 全量导入兼容形状/identity 断言
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_import_compat.sql
    - name: 110 表全量导入 catalog 普查
      run: bash ci/jobs/build/pg_data_import_census.sh
    - name: 110 表全量导入（空快照真实跑通 DELETE/COPY/回读/序列）
      run: bash ci/jobs/build/pg_data_import_full_shape.sh
    - name: M023 数据导入全链路（导出/装载/摘要/续跑）
      run: bash ci/jobs/build/pg_data_import_smoke.sh
    - name: M013 导入器全链路（SQLite → COPY → CALL）
      run: bash ci/jobs/build/pg_import_smoke.sh
    - name: 备份/恢复演练（pg_dump 19 → psql restore → 断言）
      env:
        ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wxlike_restore
        RESTORE_DB: wxlike_restore
      run: 'set -euo pipefail

        # runner 自带的 pg_dump 可能是 16，遇到 19.0 服务端会直接拒绝；

        # 用 service 容器内的 19.0 客户端导出，psql 仍走 runner（兼容旧客户端）。

        PG_CONTAINER=$(docker ps --filter "ancestor=postgres:19.0" --format "{{.ID}}" | head -1)

        test -n "$PG_CONTAINER" || { echo "postgres:19.0 service container not found" >&2; exit 1; }

        PG_DUMP_CONTAINER="$PG_CONTAINER" bash ci/jobs/build/pg_restore_drill.sh

        '
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        add-rust-environment-hash-key: false
        key: ${{ runner.os }}-pg-repo-${{ env.RUSTUP_TOOLCHAIN }}
    - name: PostgreSQL repo tests
      env:
        WXLIKE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/wxlike
      run: 'cargo test --locked -p wxlike-platform --lib domain::repo:: -- --ignored

        '
  web-v2:
    name: web-v2
    needs:
    - select
    if: needs.select.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/desktop-web/package-lock.json
    - name: C7b prepare wasm client (G01-03)
      run: bash scripts/ci-prepare-wasm-client.sh
    - name: C7b install (apps/desktop-web)
      run: npm ci
      working-directory: apps/desktop-web
    - name: C7b typecheck
      run: npm run typecheck
      working-directory: apps/desktop-web
    - name: C7b lint
      run: npm run --if-present lint
      working-directory: apps/desktop-web
    - name: C7b production build
      run: npm run build
      working-directory: apps/desktop-web
    - name: C7b unit tests
      run: npm test
      working-directory: apps/desktop-web
    - name: C7b mini-sdk install (packages/mini-sdk)
      run: npm ci --no-audit --no-fund
      working-directory: packages/mini-sdk
    - name: C7b mini-sdk typecheck
      run: npm run typecheck
      working-directory: packages/mini-sdk
    - name: C7b mini-sdk contract parity
      run: npm test
      working-directory: packages/mini-sdk
  contract:
    name: contract
    needs:
    - select
    if: needs.select.outputs.contract == 'true' || needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: C4 contract structure, seed and registry
      run: python3 ci/jobs/contract/check_contracts.py
    - name: C4 bincode variant order (Rust vs browser)
      run: python3 ci/jobs/contract/check_wire_variants.py
    - name: C4 report known gaps
      run: python3 ci/jobs/build/check_gaps.py
    - name: C4 命令目录生成物未过期（generate.py --check）
      run: python3 tools/codegen/generate.py --check
  audit:
    name: audit
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: 确保 diff 基线可用（质量门优先 origin/main，其次本地 main）
      shell: bash
      run: 'git fetch origin main:main || true

        git rev-parse --verify main

        '
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - name: install CI tooling
      run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
      with:
        tool: typos-cli,cargo-deny,cargo-audit
    - name: C10 quality metrics (incremental, base+5 tolerance)
      run: python scripts/quality-gate.py --diff --slack 5
    - name: C10 domain layer SQL ratchet
      run: python ci/jobs/build/check_domain_sql.py
    - name: C10 typos
      run: typos
    - name: C10 advisory / ban / source policy
      run: cargo deny check advisories bans sources
    - name: C10 root lock is closed
      run: cargo metadata --locked --format-version 1 > /dev/null
    - name: C10 dependency graph (cycles / layering / orphans)
      run: python scripts/dep_graph_guard.py
    - name: C10 ADR-28 scan scope covers every async+DB crate
      run: python scripts/guard_scope_guard.py
    - name: C10 single authoritative progress snapshot is in sync
      run: python scripts/progress_snapshot.py --check
    - name: C10 desktop lock is closed
      run: cargo metadata --locked --format-version 1 > /dev/null
      working-directory: ui/src-tauri
    - name: C10 root advisory audit
      run: cargo audit
    - name: C10 desktop advisory audit
      run: cargo audit
      working-directory: ui/src-tauri
    - name: C10 action pins and workflow policy
      run: 'python ci/jobs/audit/check_pins.py --pins-only

        python ci/jobs/audit/check_pins.py

        '
    - name: C10 integration-requests are machine-readable
      run: python ci/jobs/audit/check_integration_requests.py
    - name: C10 composed workflows match the checked-in fragments and the live .github/
      run: python ci/jobs/compose.py --check --check-live
    - name: C10 CI-of-CI unit tests
      run: python -m unittest discover -s ci/jobs/tests
  coverage:
    name: coverage
    needs:
    - select
    if: needs.select.outputs.rust == 'true' || needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: toolchain
      shell: bash
      run: 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview

        rustup default "$RUSTUP_TOOLCHAIN"

        '
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      with:
        add-rust-environment-hash-key: false
        key: ${{ runner.os }}-coverage-${{ env.RUSTUP_TOOLCHAIN }}
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
      with:
        tool: cargo-llvm-cov
    - name: C11 measure (blocking)
      run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
    - name: C11 incremental security-path gate
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
