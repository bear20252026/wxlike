name: ci

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTDOCFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: "1.97.1"
  WXLIKE_CI: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

x-wxlike-fragments:
  - build
  - contract
  - audit

jobs: {}
