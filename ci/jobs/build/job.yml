jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      contract: ${{ steps.select.outputs.contract }}
      ui: ${{ steps.select.outputs.ui }}
      mobile: ${{ steps.select.outputs.mobile }}
      desktop: ${{ steps.select.outputs.desktop }}
      ci: ${{ steps.select.outputs.ci }}
      full: ${{ steps.select.outputs.full }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
      - name: C0 classify changed paths
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA:-}" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base sha; forcing the full matrix"
            python3 ci/jobs/build/select_targets.py --changed-file "unclassified/first-run" --github-output "$GITHUB_OUTPUT"
          else
            python3 ci/jobs/build/select_targets.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUSTUP_TOOLCHAIN"
      - run: cargo fmt --check
      - name: Platform surface budget
        run: python3 scripts/platform_surface_audit.py --max-pub 0 --check-facades

  clippy:
    name: clippy
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUSTUP_TOOLCHAIN"
      # 不缓存 target：这条 entry 445 MB，而作业只有 ~1 min（lint），
      # 且与 test/coverage 并行——冷跑多花的几分钟被并行吸收。
      # 理由见 ci/jobs/README.md「Caching and supply chain」。
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: ${{ runner.os }}-test-${{ env.RUSTUP_TOOLCHAIN }}
      - run: cargo test --workspace --locked

  native:
    name: native (${{ matrix.os }})
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: ${{ runner.os }}-native-${{ env.RUSTUP_TOOLCHAIN }}
      - run: cargo build --workspace --all-targets --locked

  doc:
    name: doc
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      # 不缓存 target：这条 entry 445 MB，而作业只有 ~1 min（cargo doc），
      # 且与 test/coverage 并行——冷跑多花的几分钟被并行吸收。
      # 理由见 ci/jobs/README.md「Caching and supply chain」。
      - run: cargo doc --no-deps --workspace --locked

  wasm:
    name: wasm
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      # 不缓存 target：这条 entry 246 MB，而作业本身只有 ~1 min，
      # 实测缓存带来的温差 ≈ 0（对比 test/native 冷跑要多花 4-9 min）。
      # 理由见 ci/jobs/README.md「Caching and supply chain」。
      - name: C6 wasm compile (gap-aware)
        run: python3 ci/jobs/build/check_wasm.py
      # wasm-pack 固定版本：G01-03 的 JS 打包产物由它生成，版本漂移会让
      # pkg 的 package.json / .d.ts 形状变化，消费侧（desktop-web）跟着漂。
      - name: install wasm-pack (pinned)
        shell: bash
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: C6 wasm package (G01-03 JS packaging)
        run: bash scripts/build-wasm.sh
      - name: record known gaps
        run: python3 ci/jobs/build/check_gaps.py

  # 编译通过 != 能跑。crates/client-web 的浏览器行为（IndexedDB 事务时序、
  # WebCrypto、fetch AbortSignal、Web Locks 跨 tab 互斥）由 tests/browser.rs
  # 的 wasm-bindgen-test 覆盖，必须在真实 headless Chrome 里跑（G01-03-R2）。
  wasm-browser:
    name: wasm-browser
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      # 与 wasm 作业同一钉法：pkg 形状与 wasm-bindgen 版本绑定。
      - name: install wasm-pack (pinned)
        shell: bash
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      # chromedriver 必须与镜像自带 chrome 同版本；预装缺失时显式安装。
      - name: chromedriver
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v chromedriver >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromedriver
          fi
          chromedriver --version
          google-chrome --version
      - name: C6 wasm browser acceptance (G01-03)
        shell: bash
        run: wasm-pack test --headless --chrome crates/client-web
      - name: record known gaps
        run: python3 ci/jobs/build/check_gaps.py

  ui:
    name: ui
    needs: [select]
    if: needs.select.outputs.ui == 'true' || needs.select.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: C7 typecheck
        run: npm run typecheck
        working-directory: ui
      - name: C7 bundle
        run: npm run build
        working-directory: ui
      - name: C7 wire bincode selftest
        run: npm run test:wire
        working-directory: ui
      - name: C7 message index contract
        run: npm run check:msgindex
        working-directory: ui

  flutter:
    name: flutter
    needs: [select]
    # ADR-29 D1「−Dart」退役过渡：D3 的 EventSink 回调不被第三方 uniffi-bindgen-dart
    # 0.2.0 支持（生成的 Dart 编译即失败）。原生移动端走 Swift/Kotlin（官方后端），
    # Flutter 旧壳暂停 CI 构建；gate.py 接受路径跳过的作业。完整移除排 P3。
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      # 不缓存 target：这条 entry 475 MB，而作业只有 ~2 min（UniFFI 绑定 + flutter test），
      # 且与 test/coverage 并行——冷跑多花的几分钟被并行吸收。
      # 理由见 ci/jobs/README.md「Caching and supply chain」。
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          # 不缓存 SDK：一条 1.7 GB 的条目，而 runner 重新下载只要 ~5 s
          # （实测 1499 MB / 约 5 s）。配额只有 10 GB，留着它就会把 Rust
          # target 条目挤掉，被挤掉的重编要 ~5 min。
          # 理由见 ci/jobs/README.md「Caching and supply chain」。
          cache: false
      - name: C8 regenerate UniFFI bindings (generated, never hand-edited)
        run: bash crates/ffi/regenerate.sh
      - name: C8 pub get
        run: flutter pub get
        working-directory: apps/mobile
      - name: C8 analyze
        run: flutter analyze
        working-directory: apps/mobile
      - name: C8 test
        run: flutter test
        working-directory: apps/mobile

  # G00-04 S1 的可验证子集：PG 迁移冒烟。提案 DDL 已自带 BEGIN/COMMIT 且可重入，
  # 所以直接连跑两次同一文件验证幂等，再用只读断言钉住表/触发器/函数与不可变性。
  # 这里只证 DDL 在稳定版 PostgreSQL 上成立；生产 profile、真实版本与 restore
  # drill 由 G00-04 后续裁决（见 schema/registry/pg-cutover.md）。
  pg-migration:
    name: pg-migration
    needs: [select]
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wxlike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wxlike"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wxlike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: 等 PostgreSQL 就绪
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d wxlike >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready" >&2
          exit 1
      - name: M010 DDL 首次执行
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/proposals/G06/0001_ledger_commerce.sql
      - name: M010 DDL 重跑（幂等/可重入）
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/proposals/G06/0001_ledger_commerce.sql
      - name: M011-M016 DDL 首次 + 重跑（幂等）
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            schema/proposals/G02/0002_identity_pg_compat.sql \
            schema/proposals/G04/0002_media_pg_compat.sql \
            schema/proposals/G06/0002_ledger_wallets_backfill.sql \
            schema/proposals/G05/0003_content_pg_compat.sql \
            schema/proposals/G02/0003_identity_retry.sql \
            schema/proposals/G02/0004_identity_session_meta.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: M017 前写入旧侧车 fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_m017_backfill_fixture.sql
      - name: M017 DDL 首次 + 重跑（幂等 + 回填）
        shell: bash
        run: |
          set -euo pipefail
          for _ in 1 2; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f schema/proposals/G02/0005_identity_session_meta.sql
          done
      - name: M018 侧车清理触发器首次 + 重跑（幂等）
        shell: bash
        run: |
          set -euo pipefail
          for _ in 1 2; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f schema/proposals/G02/0006_identity_session_meta_cleanup.sql
          done
      - name: M019-M022 消息/关系/序列号首次 + 重跑（幂等）
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            schema/proposals/G03/0001_message_timeline.sql \
            schema/proposals/G03/0002_message_delivery.sql \
            schema/proposals/G02/0007_relations_acs.sql \
            schema/proposals/G02/0008_identity_token_serial.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: M010 schema/触发器/不可变性断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts.sql
      - name: M011-M013 兼容层与回填断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_compat.sql
      - name: M014 内容/工单表断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_content.sql
      - name: M015 identity_retry 断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_retry.sql
      - name: M016 identity 会话侧车列断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_session_meta.sql
      - name: M017 identity 会话侧车表断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_session_meta_table.sql
      - name: M018 identity 会话侧车清理断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_identity_session_meta_cleanup.sql
      - name: M019-M022 消息/关系/序列号形状断言
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/jobs/build/pg_migration_asserts_g03.sql
      - name: M013 导入器全链路（SQLite → COPY → CALL）
        run: bash ci/jobs/build/pg_import_smoke.sh
      - name: 备份/恢复演练（pg_dump → psql restore → 断言）
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wxlike_restore
          RESTORE_DB: wxlike_restore
        run: bash ci/jobs/build/pg_restore_drill.sh
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: ${{ runner.os }}-pg-repo-${{ env.RUSTUP_TOOLCHAIN }}
      - name: PostgreSQL repo tests
        env:
          WXLIKE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/wxlike
        run: |
          cargo test --locked -p wxlike-platform --lib domain::repo:: -- --ignored

