jobs:
  web-v2:
    name: web-v2
    needs: [select]
    if: needs.select.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop-web/package-lock.json
      - name: C7b install (apps/desktop-web)
        run: npm ci
        working-directory: apps/desktop-web
      - name: C7b typecheck
        run: npm run typecheck
        working-directory: apps/desktop-web
      # `--if-present`: the lint script is owned by the apps/ agent and lands
      # separately; it blocks here as soon as it exists (drop --if-present
      # once apps/desktop-web/package.json ships `lint`).
      - name: C7b lint
        run: npm run --if-present lint
        working-directory: apps/desktop-web
      - name: C7b production build
        run: npm run build
        working-directory: apps/desktop-web
      - name: C7b unit tests
        # 必须晚于 build：宿主守卫读的是构建产物 dist/index.html 里被 vite 实际
        # 注入的那份 meta CSP，只有交集算得过真产物才有意义（#158）。
        run: npm test
        working-directory: apps/desktop-web
      - name: C7b mini-sdk contract parity (packages/mini-sdk, no deps to install)
        run: npm test
        working-directory: packages/mini-sdk
