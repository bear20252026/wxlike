# Production-shaped Compose file for a single wxlike-server container.
#
#   cp deploy/production/wxlike.env.example deploy/production/wxlike.env
#   cp deploy/production/wxlike-admin.env.example deploy/production/wxlike-admin.env
#   # edit secrets in both, then (adminx 的镜像引用与令牌走第二个 env-file):
#   docker compose -f containers/server/compose.prod.yml \
#     --env-file deploy/production/wxlike.env \
#     --env-file deploy/production/wxlike-admin.env up -d
#
# Redis is only started with --profile redis; a managed Redis is preferred in
# production (set WXLIKE_REDIS_URL accordingly).
name: wxlike

services:
  server:
    image: ${WXLIKE_IMAGE:?set WXLIKE_IMAGE to an immutable image reference}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ../../deploy/production/wxlike.env
    environment:
      WXLIKE_DB: /data/wxlike.db
      WXLIKE_MEDIA_DIR: /data/media
      WXLIKE_HTTP: 0.0.0.0:8099
      WXLIKE_QUIC: 0.0.0.0:9443
      WXLIKE_DEV_INSECURE: "0"
    ports:
      - "8099:8099"
      - "9443:9443/udp"
    volumes:
      - wxlike-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8099/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 运营后台 adminx（独立进程 wxlike-admin）：对平台库只读，写操作转发给 server。
  # 不变量由 containers/admin/verify-image.sh 与 containers/admin/smoke.sh 守。
  adminx:
    image: ${WXLIKE_ADMIN_IMAGE:?set WXLIKE_ADMIN_IMAGE to an immutable image reference}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ../../deploy/production/wxlike-admin.env
    environment:
      # 平台库与账号库是同一个 /data 卷里的两个文件：平台库由 server 写，
      # adminx 以 SQLITE_OPEN_READ_ONLY + PRAGMA query_only 打开，只写自己的
      # adminx.db。不挂 :ro——adminx 的 query_only 回退需要可写标志打开，
      # 只读挂载会让那条回退路径直接失败（read.rs::open）。
      WXLIKE_DB: /data/wxlike.db
      WXLIKE_ADMIN_DB: /data/adminx.db
      WXLIKE_ADMIN_BIND: 0.0.0.0:8090
      WXLIKE_PLATFORM_URL: http://server:8099
      # 两个令牌必须显式给：缺失 WXLIKE_ADMIN_TOKEN 时 adminx 拒绝启动；
      # WXLIKE_ADMIN_PLATFORM_TOKEN 必须是 identity 域签发的 Admin audience
      # 会话令牌（PR #453），静态令牌打治理端点会 401。
      WXLIKE_ADMIN_TOKEN: ${WXLIKE_ADMIN_TOKEN:?set WXLIKE_ADMIN_TOKEN in deploy/production/wxlike-admin.env}
      WXLIKE_ADMIN_PLATFORM_TOKEN: ${WXLIKE_ADMIN_PLATFORM_TOKEN:?set WXLIKE_ADMIN_PLATFORM_TOKEN to an Admin-audience session token (PR #453)}
    ports:
      # 主机侧只绑回环：这是权限最高的面，公网部署前必须加反代 + TLS。
      - "127.0.0.1:8090:8090"
    volumes:
      - wxlike-data:/data
    depends_on:
      server:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - redis-data:/data
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wxlike-data:
  redis-data:
