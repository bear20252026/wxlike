# cargo-audit 配置（T-F1 / #61）。
#
# 这里的 ignore **不是许可白名单**，只登记"当前锁文件里已知、且不在默认编译图里"
# 的公告；新公告仍会让 audit job 变红。
#
# 历史记录：曾为 rustls-webpki 0.102.8（async-nats 0.42 传递依赖）豁免 5 条公告；
# 2026-10-24 async-nats 升到 0.50 后 0.102 整树从锁里消失，豁免已按约定删除。
# 为什么不用 CLI --ignore：配置跟着仓库走，评审时能看见豁免清单与到期条件。
[advisories]
ignore = []
