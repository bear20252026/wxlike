[package]
name = "wxlike-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wxlike-core = { path = "../core" }
wxlike-message = { path = "../message" }
wxlike-risk = { path = "../risk" }
wxlike-moderation = { path = "../moderation" }
wxlike-report = { path = "../report" }
# P4/P5 通话房间状态机（rtc::room）与出口码率分配（rtc::sfu）
wxlike-rtc = { path = "../rtc" }
tokio = { workspace = true }
axum = { version = "0.8", features = ["macros", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
# WP-13: statement-level profiling for the slow-query log
tracing = "0.1"
pbkdf2 = "0.12"
# P4 ADR-3: argon2id password upgrade + TOTP 2FA (borrowed crates)
argon2 = "0.5"
totp-rs = { version = "5", default-features = false, features = ["gen_secret"] }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
# P5 直播推流凭据（HMAC-SHA256）；hmac 已在 pbkdf2 的依赖树里
hmac = "0.12"
async-trait = { workspace = true }

[dev-dependencies]
# 端到端媒体协商测试要匹配 `wxlike_rtc::media::pump` 返回的 `str0m::Event`
str0m = { version = "0.9", default-features = false, features = ["sha1"] }
time = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"

# Windows 的加密后端必须与 rtc 一致，否则 cargo 会编两份 str0m
[target.'cfg(windows)'.dev-dependencies]
str0m = { version = "0.9", default-features = false, features = ["sha1", "wincrypto"] }
