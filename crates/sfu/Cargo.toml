[package]
name = "wxlike-sfu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wxlike-rtc = { path = "../rtc" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 与 rtc 同版本同特性，避免编两份 str0m
str0m = { version = "0.9", default-features = false, features = ["sha1"] }

[target.'cfg(windows)'.dependencies]
str0m = { version = "0.9", default-features = false, features = ["sha1", "wincrypto"] }
