[package]
name = "wxlike-net"
version.workspace = true
edition.workspace = true

[dependencies]
wxlike-core = { path = "../core" }
wxlike-mq = { path = "../mq" }
tokio = { workspace = true }
anyhow = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
rusqlite = { workspace = true }

[dev-dependencies]
# WP-02/A2 integration test drives the platform HTTP API against a live hub.
wxlike-platform = { path = "../platform" }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }

# WP-04 A3: the task book names the benchmark scripts, so they live in
# scripts/ and are wired in as example targets.
[[example]]
name = "bench_group"
path = "../../scripts/bench_group.rs"
