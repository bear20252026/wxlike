[package]
name = "wxlike-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wxlike-core = { path = "../core" }
wxlike-mq = { path = "../mq" }
wxlike-message = { path = "../message" }
tokio = { workspace = true }
anyhow = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
rusqlite = { workspace = true }
# WP-12 TOFU: SHA-256 certificate fingerprints for first-use pinning
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
# WP-13: hub observability (Prometheus text format) + forwarding traces
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tracing = "0.1"
# P3 ADR-8: WebSocket carrier for the hub (browsers have no QUIC). axum is
# already in the monolith's tree; the "ws" feature is what we actually need.
axum = { version = "0.8", features = ["ws"] }

[features]
# 实验室专用构造（`Client::connect` / `connect_anonymous` /
# `connect_retry_insecure`）跳过证书校验，**默认关闭**。
#
# 这是 `--insecure-lab` 开关在库侧的落地：库没有 CLI，编译期 feature 是唯一
# 的"显式 opt-in"。默认构建里这三个构造根本不存在，生产代码请用
# `connect_verified` / `connect_retry_verified`（TOFU + 证书固定）。
insecure-lab = []

[dev-dependencies]
futures-util = "0.3"
# 自依赖只为在**测试与示例**里打开 `insecure-lab`：本仓 20+ 个集成测试和
# scripts/bench_*.rs 需要跳过校验的构造。`cargo build` 不走 dev-dependencies，
# 所以默认构建里仍然没有它们。
wxlike-net = { path = ".", features = ["insecure-lab"] }
# WP-02/A2 integration test drives the platform HTTP API against a live hub.
wxlike-platform = { path = "../platform" }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# WP-05 integration test synthesizes and decodes real PNGs
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# WP-04 A3: the task book names the benchmark scripts, so they live in
# scripts/ and are wired in as example targets.
[[example]]
name = "bench_group"
path = "../../scripts/bench_group.rs"

# WP-13 A2: hub load benchmark (10k conns / 1k msg/s / 60s; see docs/bench).
[[example]]
name = "bench_hub"
path = "../../scripts/bench_hub.rs"
