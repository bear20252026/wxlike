[package]
name = "wxlike-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# cdylib → Android .so / iOS .dylib；staticlib → 静态链进宿主；lib → Rust 侧测试用。
[lib]
name = "wxlike_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# 要绑的就是这一层：协议 + 命令执行器（业务规则的唯一落点）
wxlike-client = { path = "../client" }
wxlike-cmd = { path = "../cmd" }
wxlike-core = { path = "../core" }
# `scaffolding-ffi-buffer-fns` 不是可选项：uniffi-bindgen-dart 生成的绑定走的是
# ffibuffer 调用约定（一次调用把参数打成一个 buffer 递进去），而 uniffi 0.32 默认
# 不导出那批 `uniffi_ffibuffer_*` 符号。不开它的话绑定层每个调用都在
# DynamicLibrary.lookup 上失败，而且失败点在 Rust 之外，cargo test 全绿也照样跑不通。
uniffi = { version = "0.32.2", features = ["scaffolding-ffi-buffer-fns"] }
# 第三方 Dart 后端（Mozilla 的 uniffi 官方只有 Kotlin/Swift/Python/Ruby）。
# MIT；只在生成绑定时用，见 crates/ffi/src/bin/uniffi-bindgen-dart.rs。
uniffi-bindgen-dart = { version = "0.2.0", optional = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# 只在生成绑定时开：`uniffi/cli` 会拉进 uniffi_bindgen，不该链进手机上的 .so
bindgen = ["uniffi/cli"]
dart = ["dep:uniffi-bindgen-dart"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "uniffi-bindgen-dart"
path = "src/bin/uniffi-bindgen-dart.rs"
required-features = ["bindgen", "dart"]
