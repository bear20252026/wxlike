[package]
name = "wxlike-video"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wxlike-core = { path = "../core" }
tokio = { workspace = true }
axum = { version = "0.8", features = ["macros", "multipart"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = "0.1"
# E1 播放统计（rusqlite 已由 wxlike-core 引入，不新增锁版本）
rusqlite = { workspace = true }
# E1 补缺省 session_id 用（形状照搬 platform 的 random_hex；rand 已在 workspace 依赖里）
rand = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
