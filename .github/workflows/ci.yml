name: ci

# DoD from docs/WORK_BREAKDOWN.md §0.2:
# D1 build · D2 clippy -D warnings · D3 test · D4 fmt · D6 doc
#
# 治理门禁（T-F1）：coverage / unwrap-count 在本文件；cargo audit 在 audit.yml
# （单独 workflow，避免每周 schedule 把 Android 出包等 job 全部重跑）。

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        # 结构阈值在 clippy.toml（60 行）。这里**不能**加 `-W clippy::too_many_lines`：
        # 实测 `-D warnings` 会覆盖它，存量 46 个长函数立刻变成硬错（试过，红了）。
        # 想看清单就在本地跑：
        #   cargo clippy --workspace --all-targets -- -W clippy::too_many_lines
        # 拦"变差"是 quality job 的事（比阈值更准：只比基线）。
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 质量闸门：审计基线只许变好（docs/code-quality-audit.md）。
  # 不跑 cargo，纯静态统计，十几秒；失败信息直接说清哪项退化了。
  quality:
    name: quality (metrics gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: metrics gate
        run: python scripts/quality-gate.py
      # 预编译二进制，不编译（typos/deny 各自 cargo install 要几分钟）
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-deny
      - name: typos（拼写）
        run: typos
      # 许可证 / 安全公告 / 依赖来源：配置见 deny.toml，豁免必须写原因
      - name: supply chain（licenses / advisories / bans / sources）
        run: cargo deny check

  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  # macOS 是"Mac mini 自建服务器"的目标平台，必须进矩阵——
  # 不进矩阵就等于没人验证过，等到客户机上才发现编不过是最贵的失败。
  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  doc:
    name: doc (rustdoc links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --workspace

  # Android 出包：**这一关要回答的是"新检出能不能出 APK"**。
  #
  # 之前没有任何 CI 覆盖移动端，所以"apps/mobile 能编出包"只在我本机成立过；
  # 生成物（Dart 绑定、.so）都不入库，任何一次 Rust 改动都可能让移动端静默坏掉，
  # 而 CI 全绿。这个 job 就是把那条路径钉住。
  #
  # 成本：约 10–14 分钟（首次 gradle 下载更久）。缓存了 cargo target、gradle、
  # Flutter SDK。嫌慢可以加 `paths:` 过滤，但那就等于放弃"每次都能出包"的保证。
  android:
    name: android (apk)
    runs-on: ubuntu-latest
    # **必须显式设**：runner 上 `$ANDROID_HOME` 是空的（实测），
    # 于是 `"$ANDROID_HOME/cmdline-tools/..."` 变成一条空命令，
    # 报 `line 5: : command not found` + exit 127 —— 看起来像 sdkmanager 坏了，
    # 其实只是环境变量没设。这是第一次跑 CI 就踩到的。
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7

      # 交叉编译到 arm64（真机；x86_64 只有模拟器要，CI 不编）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Android SDK 组件
        # `flutter.ndkVersion` 是 28.2.13676358（Flutter 3.47 的默认值）。
        # runner 预装的 NDK 比它旧，AGP 会直接报 "NDK not configured"，
        # 所以显式装一次——版本写死在这里，别指望"runner 上应该会有"。
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # 先确认它真的在：路径变了要立刻说清楚，而不是等到后面报一堆
          # "NDK not configured" 让人去猜。
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager 不在 $SDKMANAGER；runner 镜像可能变了，检查 ANDROID_HOME" >&2
            ls "$ANDROID_HOME" >&2 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk=36 / build-tools 36 / NDK 28.2 —— 三个都显式要，
          # 不依赖 runner 预装了什么版本
          "$SDKMANAGER" --install             "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 生成 UniFFI 绑定
        # Dart 绑定不入库（`apps/mobile/lib/src/rust/`），少了它 flutter analyze
        # 会报上百个"类型不存在"。这个脚本先 build cdylib 再从产物读接口形状。
        run: bash crates/ffi/regenerate.sh

      - name: 交叉编译 libwxlike_ffi.so
        run: |
          cargo ndk -t arm64-v8a -o apps/mobile/android/app/src/main/jniLibs \
            build -p wxlike-ffi --release
          # release 产物带符号表，strip 掉能少一半；apk 体积直接受影响。
          # 两个坑都在这里踩过：
          #  1. **不要加 `-type f`**：NDK 里的 llvm-strip 是指向 llvm-strip-18 的
          #     符号链接，`-type f` 会把它们全过滤掉，STRIP 变成空串，
          #     下一行就成了"空命令"→ exit 127（本地是 llvm-strip.exe 普通文件，
          #     所以本地永远不暴露）；
          #  2. 取不到就跳过，别让"少 strip 一次"把整个 job 弄红。
          STRIP=$(find "$ANDROID_HOME/ndk" -name 'llvm-strip' 2>/dev/null | sort | tail -1)
          if [ -n "$STRIP" ] && [ -x "$STRIP" ]; then
            "$STRIP" --strip-unneeded apps/mobile/android/app/src/main/jniLibs/arm64-v8a/libwxlike_ffi.so
            ls -lh apps/mobile/android/app/src/main/jniLibs/arm64-v8a/libwxlike_ffi.so
          else
            echo "警告：找不到可执行的 llvm-strip，跳过 strip（apk 会大一些）" >&2
          fi

      - name: 构建 APK
        run: |
          cd apps/mobile
          flutter pub get
          # release 用 debug 签名（模板默认），CI 只验证"能出包"，不发布
          flutter build apk --release --target-platform android-arm64

      # 合并清单在 `flutter build` 之后才生成，所以只能构建完再校。
      - name: 校验 release 合并清单带 INTERNET（构建后）
        run: |
          cd apps/mobile
          MERGED=$(find build -name "AndroidManifest.xml" -path "*release*" | head -1)
          if [ -z "$MERGED" ]; then
            echo "::error::构建后仍找不到 release 的合并清单" >&2
            exit 1
          fi
          echo "合并清单：$MERGED"
          grep -q 'android.permission.INTERNET' "$MERGED" || {
            echo "::error::release 合并清单里没有 INTERNET 权限" >&2
            exit 1
          }
          echo "release 合并清单带 INTERNET ✓"

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: wxlike-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Web 前端：typecheck + 手写 bincode 的自测（issue #18）。
  #
  # `ui/src/web/wire.ts` 是**手写的 bincode 编解码**（浏览器没有 bincode），
  # 它的变体序号必须与 Rust 的 `WireFrame` 声明顺序一致。改协议时那边编译
  # 不会报错、这边也不报——只有运行时帧解析错位。`wire.selftest.mjs` 里
  # 的 fixtures 就是钉这个的，但在此之前它从没在 CI 跑过。
  web:
    name: web (tsc + wire selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: typecheck
        run: npm run typecheck
        working-directory: ui
      - name: wire bincode selftest
        run: npm run test:wire
        working-directory: ui
      - name: message index contract
        run: npm run check:msgindex
        working-directory: ui

  # Flutter：analyze + test（issue #18）。
  #
  # 绑定是生成物（`apps/mobile/lib/src/rust/` 不入库），所以要先跑
  # `regenerate.sh` —— 少了它 `flutter analyze` 会报上百个"类型不存在"。
  flutter:
    name: flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-bindgen
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: 生成 UniFFI Dart 绑定
        run: bash crates/ffi/regenerate.sh
      - name: pub get
        run: flutter pub get
        working-directory: apps/mobile
      - name: analyze
        run: flutter analyze
        working-directory: apps/mobile
      - name: test
        run: flutter test
        working-directory: apps/mobile

  # 桌面端（Tauri）：命令层对真实服务端的集成测试（issue #18 收尾）。
  #
  # 这套测试以前**从没进过 CI**，代价很具体：
  # - #3 把握手改成"只收 token"之后，`p2_messages` 还在拿 user_id 当凭据，
  #   6 条测试一直红着没人知道；
  # - P3 陌生人闸门上线后，5 条"非好友直聊"的测试悄悄失效。
  # 两者都是"本地跑一次就能发现"的问题——所以这一关必须存在。
  desktop:
    name: desktop (tauri commands)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target
      # tauri 2 在 Linux 上编译期就要 webkit2gtk-4.1 / gtk3 的头文件
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ui/src-tauri
      - name: test
        run: cargo test
        working-directory: ui/src-tauri

  # 覆盖率（T-F1 / #61 L-3）：**先非阻断**。
  #
  # 阈值不在这里拍脑袋：先跑两周收集实测分布，由集成方在 Wave 3 依据基线定。
  # 测量失败也不红——真正的编译/测试失败由 test-linux 拦；这个 job 只负责
  # 让数字在 PR 评论和 artifact 里可见。
  coverage:
    name: coverage (llvm-cov, non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: measure（失败不阻断）
        continue-on-error: true
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: summarize
        if: always()
        run: |
          set -o pipefail
          python scripts/coverage_summary.py lcov.info \
            --output coverage-summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage-summary.md
          if-no-files-found: warn
      # fork PR 的 token 是只读的，失败也不影响 job（continue-on-error）。
      - name: comment on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage-summary.md')) {
              core.info('没有 coverage-summary.md，跳过 PR 评论');
              return;
            }
            // 同一个 PR 每次 push 更新同一条评论，避免刷屏。
            // legacy 用来接管加 marker 之前已经发过的那条评论。
            const marker = '<!-- coverage-report -->';
            const legacy = '## 覆盖率（非阻断）';
            const body = marker + '\n' + fs.readFileSync('coverage-summary.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => {
              const text = c.body || '';
              return c.user?.type === 'Bot' &&
                (text.includes(marker) || text.startsWith(legacy));
            });
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`已更新已有评论 #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # #53 防回潮（T-F1 交付物）：只统计生产代码里的 unwrap()/expect()。
  #
  # **非阻断**：计数回潮时脚本仍退出 0，结果贴进 PR 评论与 artifact；
  # 要升级成硬闸门，在脚本调用处加 `--fail-on-increase` 即可。
  unwrap-count:
    name: unwrap count (non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # set -o pipefail：别让 tee 的退出码掩盖脚本自己的失败
      - name: count
        run: |
          set -o pipefail
          python scripts/count_unwraps.py --details | tee unwrap-report.txt
      - name: step summary
        if: always()
        run: |
          if [ -f unwrap-report.txt ]; then
            cat unwrap-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "unwrap count 未生成报告（见上一步日志）" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unwrap-count
          path: unwrap-report.txt
          if-no-files-found: warn
      - name: comment on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('unwrap-report.txt')) {
              core.info('没有 unwrap-report.txt，跳过 PR 评论');
              return;
            }
            // 同一个 PR 每次 push 更新同一条评论，避免刷屏。
            const marker = '<!-- unwrap-count -->';
            const legacy = '## unwrap()/expect() 计数（非阻断）';
            const body = marker + '\n' + legacy + '\n\n```text\n' +
              fs.readFileSync('unwrap-report.txt', 'utf8') + '```\n';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => {
              const text = c.body || '';
              return c.user?.type === 'Bot' &&
                (text.includes(marker) || text.startsWith(legacy));
            });
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`已更新已有评论 #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
