name: ci

# DoD from docs/WORK_BREAKDOWN.md §0.2:
# D1 build · D2 clippy -D warnings · D3 test · D4 fmt · D6 doc

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        # 结构阈值在 clippy.toml（60 行）。这里**不能**加 `-W clippy::too_many_lines`：
        # 实测 `-D warnings` 会覆盖它，存量 46 个长函数立刻变成硬错（试过，红了）。
        # 想看清单就在本地跑：
        #   cargo clippy --workspace --all-targets -- -W clippy::too_many_lines
        # 拦"变差"是 quality job 的事（比阈值更准：只比基线）。
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 质量闸门：审计基线只许变好（docs/code-quality-audit.md）。
  # 不跑 cargo，纯静态统计，十几秒；失败信息直接说清哪项退化了。
  quality:
    name: quality (metrics gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: metrics gate
        run: python scripts/quality-gate.py
      # 预编译二进制，不编译（typos/deny 各自 cargo install 要几分钟）
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-deny
      - name: typos（拼写）
        run: typos
      # 许可证 / 安全公告 / 依赖来源：配置见 deny.toml，豁免必须写原因
      - name: supply chain（licenses / advisories / bans / sources）
        run: cargo deny check

  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  # macOS 是"Mac mini 自建服务器"的目标平台，必须进矩阵——
  # 不进矩阵就等于没人验证过，等到客户机上才发现编不过是最贵的失败。
  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  doc:
    name: doc (rustdoc links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --workspace
