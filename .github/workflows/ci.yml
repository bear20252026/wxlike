name: ci

# DoD from docs/WORK_BREAKDOWN.md §0.2:
# D1 build · D2 clippy -D warnings · D3 test · D4 fmt · D6 doc

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        # `-W clippy::too_many_lines` 放在 `-D warnings` 之后：只降级这一条，
        # 其余仍是硬错。阈值在 clippy.toml（60 行）。存量 47 个长函数只打印
        # 不拦构建——拦"变差"是 quality job 的事。
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::too_many_lines

  # 质量闸门：审计基线只许变好（docs/code-quality-audit.md）。
  # 不跑 cargo，纯静态统计，十几秒；失败信息直接说清哪项退化了。
  quality:
    name: quality (metrics gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: metrics gate
        run: python scripts/quality-gate.py

  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  # macOS 是"Mac mini 自建服务器"的目标平台，必须进矩阵——
  # 不进矩阵就等于没人验证过，等到客户机上才发现编不过是最贵的失败。
  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  doc:
    name: doc (rustdoc links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --workspace
