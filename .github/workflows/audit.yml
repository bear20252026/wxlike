name: audit

# T-F1（#61 L-3）：cargo audit 单独成 workflow，**周跑 + PR 跑，失败阻断**。
#
# 为什么不塞进 ci.yml：周跑要在 schedule 触发，而 ci.yml 的 schedule 会把
# 9 个 job（含 Android 出包）在每周一全部重跑一遍。这里只跑安全公告检查，
# 与 ci.yml 的 cargo deny（licenses/advisories/bans/sources）互补：
# deny 管许可与依赖来源，audit 只盯 RustSec 公告，输出更好读。

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每周一 03:17 UTC（避开整点排队）
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 预编译二进制；`cargo install cargo-audit` 要编译几分钟
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: audit
        run: cargo audit
