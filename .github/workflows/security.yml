name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      release_review:
        description: "Run the blocking release evidence review (requires online advisories)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: "1.97.1"
  CARGO_TERM_COLOR: always
  PYTHONPATH: tools/source-audit

jobs:
  static:
    name: security (source + policy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: tool regression tests
        run: python -m unittest discover -s tools/source-audit/tests
      - name: provenance
        run: python -m sourceaudit provenance check --root .
      - name: SBOM drift
        run: python -m sourceaudit sbom check --root .
      - name: offline advisory policy
        run: python -m sourceaudit advisories check --root . --offline
      - name: authorization matrix
        run: python -m sourceaudit authz check --root .

  regression:
    name: security (authz + abuse + decode)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WXLIKE_FUZZ_ITERS: ${{ github.event_name == 'schedule' && '200000' || '2000' }}
      WXLIKE_FUZZ_CRASH_DIR: ${{ github.workspace }}/security-crashes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: tests/security -> target
          key: security-${{ env.RUSTUP_TOOLCHAIN }}
      - name: independent workspace format
        run: cargo fmt --manifest-path tests/security/Cargo.toml --check
      - name: security regression
        run: cargo test --locked --manifest-path tests/security/Cargo.toml
      - name: upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-crashes-${{ github.run_id }}
          path: security-crashes
          if-no-files-found: ignore
          retention-days: 14

  online:
    name: security (online advisories)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: online advisory review
        run: python -m sourceaudit advisories check --root . --timeout 20

  # One context that can be made required: #277 exists because "the workflow goes
  # red" and "the merge is blocked" are two different settings, and the two jobs
  # that run on every PR were not named by any required context. Aggregate them
  # into a single check so the admin only has to require one string.
  #
  # Only jobs that run on every event may be needed here. `online` and
  # `release-review` are schedule/dispatch-only: needing them would leave this
  # job pending forever on a normal PR.
  gate:
    name: security (gate)
    needs: [static, regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both always-run security jobs to succeed
        env:
          STATIC: ${{ needs.static.result }}
          REGRESSION: ${{ needs.regression.result }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "static=$STATIC" "regression=$REGRESSION"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "security $name -> $result"
            if [ "$result" != "success" ]; then
              echo "::error::security job $name did not succeed (result=$result); security (gate) fails so it can block the merge"
              fail=1
            fi
          done
          exit "$fail"

  release-review:
    name: security (release evidence)
    if: github.event_name == 'workflow_dispatch' && inputs.release_review
    needs: [static, regression, online]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: evaluate release evidence
        run: python -m sourceaudit release check --root . --json > release-review.json
      - name: preserve release verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-review-${{ github.run_id }}
          path: release-review.json
          if-no-files-found: error
