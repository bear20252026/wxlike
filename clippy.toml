# clippy 的结构阈值（见 docs/code-quality-audit.md）。
#
# 这些阈值本身不会让 clippy 报错——对应的 lint 属于 pedantic / nursery 组，
# 需要显式开启。CI 的 lint 步骤用 `-W clippy::too_many_lines` 打开"只看不拦"
# 的模式：存量 47 个长函数不该让构建立刻红，但新写的长函数会在日志里露出来。
# 真正的"只许变好"由 scripts/quality-gate.py 守（比对基线）。

# 函数体量：审计报告的目标是 ≤30 行，闸门先卡在 60（存量 47 个的上一档）。
too-many-lines-threshold = 60

# 参数过多通常意味着"这个函数在替调用方拼装一个对象"，该传结构体了。
too-many-arguments-threshold = 8

# 认知复杂度比圈复杂度更接近"人读起来累不累"。
cognitive-complexity-threshold = 20

# 类型复杂度：超长元组/嵌套泛型，审计里 `video_refs.rs` 就踩过一次。
type-complexity-threshold = 250
