# typos 配置：把"领域缩写"与"刻意的短名"排除，剩下的才是真错字。
#
# 用法：
#   typos                      # 全仓库扫
#   typos --format brief       # 一行一条，适合贴进 issue
#
# 加词的原则：**只加确实不是错字的**。为了让 CI 变绿而把真错字塞进白名单，
# 等于把工具关掉。

[default]
# RFC 4648 的 base64 示例向量：`b64url_encode(b"fo") == "Zm8"` 是标准原文里的
# 输入，不是 "of" 的错字。这里只豁免这一处写法，不把 `fo` 整个词从检查里拿掉
# ——`extend-words` 是仓库级的长期白名单，随手加等于把工具关掉。
extend-ignore-re = ['b64url_encode\(b"fo"\)']

[default.extend-words]
# owner type / owner id：`MessageStore::owner_pair` 的返回值，全仓库都这么叫
ot = "ot"
oid = "oid"
# 消息类型 id 的缩写（type_id 的配套变量名）
tid = "tid"
# 测试里给审核规则起的短名（"b" / "a" 的规则标签）
ba = "ba"
# 上游项目名：Lonami/grammers（Telegram 的 Rust 客户端库），不是 "grammars"
grammers = "grammers"
# 引用第三方 API 的字段名：box-im 的 `chat-group-readed`
readed = "readed"
# 两个都是合法拼写，只是不是 typos 的首选；改了只是 churn
clonable = "clonable"
unparseable = "unparseable"
# Recovery Time Objective：备份恢复指标，不是拼写错误。
rto = "rto"
# DEFLATE 压缩：crate 名 flate2（typos 分词把 flate2 拆成 flate+2）；SBOM 生成物里出现
flate = "flate"
# ICU4X 的 writeable crate：合法包名，非 writable 误拼；SBOM 生成物里出现
writeable = "writeable"
# 测试里故意写入的坏数据（corrupt_rows.rs）：验证系统能识别并拒绝损坏的行。
# 这些拼写是**故意的**，不是错字。
accepteed = "accepteed"
onwer = "onwer"
userr = "userr"
# `fnd` 是 Tinode 的 `ModeCMeFnd`（friend 的缩写），协议常量。
fnd = "fnd"

[files]
# 生成物与第三方镜像不参与检查
extend-exclude = [
    "**/node_modules",
    "ui/dist",
    "ui/dist-web",
    "apps/desktop-web/dist",
    "crates/ffi/generated",
    "apps/mobile/lib/src/rust",
    "target",
    "refs",
]
