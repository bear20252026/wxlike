[workspace]
resolver = "2"
members = ["crates/api", "crates/types", "crates/client-core", "crates/client-native", "crates/client-web", "crates/core", "crates/limits", "crates/net", "crates/dpage", "crates/container", "crates/features/miniapps", "crates/features/commerce", "crates/features/identity", "crates/features/media", "crates/features/relations", "crates/features/security", "crates/features/discovery", "crates/service-catalog", "crates/vision", "crates/translation", "crates/mq", "crates/platform", "crates/push", "crates/rtc", "crates/sfu", "crates/client", "crates/ffi", "crates/cmd", "crates/cli", "crates/mcp", "crates/video", "crates/message", "crates/search", "crates/ledger", "crates/risk", "crates/moderation", "crates/report", "crates/admin", "server"]
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rcgen = "0.13"
# 0.14.3 起修掉 zstd-safe 的三条公告（RUSTSEC-2026-0391/0398/0403）；
# tantivy 那条链本来就在用 0.14.3，升上来是合并重复版本而不是引入新代码。
zstd = "0.14"
boa_engine = "0.20"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
async-trait = "0.1"
# #320 / REQ-G00-rmcp-pin：MCP 协议层用官方 rmcp，不再手写 JSON-RPC 分派。
# 刻意不开 `client` / `transport-streamable-http-server` / `server-side-http`：
# 远程 transport 要等 G15-02 的会话授权、audience 与 Origin 绑定落地（见
# integration-requests/G15/G15-01.yaml），少开一个 feature 就少一条能监听的路。
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
# A2 静态托管：/app 直接发网页（ServeDir/ServeFile）
tower-http = { version = "0.7", features = ["fs", "set-header"] }
