[workspace]
resolver = "2"
members = ["crates/api", "crates/core", "crates/limits", "crates/net", "crates/dpage", "crates/container", "crates/mq", "crates/platform", "crates/push", "crates/rtc", "crates/sfu", "crates/client", "crates/ffi", "crates/cmd", "crates/cli", "crates/mcp", "crates/video", "crates/message", "crates/search", "crates/ledger", "crates/risk", "crates/moderation", "crates/report", "crates/admin", "server"]
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rcgen = "0.13"
zstd = "0.13"
boa_engine = "0.20"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
async-trait = "0.1"
# A2 静态托管：/app 直接发网页（ServeDir/ServeFile）
tower-http = { version = "0.7", features = ["fs", "set-header"] }
