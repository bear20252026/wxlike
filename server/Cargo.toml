[package]
name = "wxlike-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wxlike-server"
path = "src/main.rs"

[dependencies]
wxlike-net = { path = "../crates/net" }
wxlike-mq = { path = "../crates/mq" }
wxlike-platform = { path = "../crates/platform" }
wxlike-core = { path = "../crates/core" }
wxlike-push = { path = "../crates/push" }
wxlike-video = { path = "../crates/video" }
async-trait = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# WP-13: request/tracing observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
redis = ["wxlike-mq/redis"]

[dev-dependencies]
# integration tests drive the real HTTP surface (ureq matches the UI's client)
ureq = { version = "2", features = ["json"] }
