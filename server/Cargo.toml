[package]
name = "wxlike-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wxlike-server"
path = "src/main.rs"

[dependencies]
wxlike-net = { path = "../crates/net" }
wxlike-mq = { path = "../crates/mq" }
wxlike-platform = { path = "../crates/platform" }
wxlike-core = { path = "../crates/core" }
async-trait = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
anyhow = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
redis = ["wxlike-mq/redis"]
