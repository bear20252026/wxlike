[package]
name = "wxlike-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wxlike-server"
path = "src/main.rs"

[dependencies]
wxlike-net = { path = "../crates/net" }
wxlike-mq = { path = "../crates/mq" }
wxlike-platform = { path = "../crates/platform" }
wxlike-message = { path = "../crates/message" }
wxlike-risk = { path = "../crates/risk" }
wxlike-moderation = { path = "../crates/moderation" }
wxlike-report = { path = "../crates/report" }
wxlike-core = { path = "../crates/core" }
wxlike-push = { path = "../crates/push" }
wxlike-video = { path = "../crates/video" }
wxlike-search = { path = "../crates/search" }
async-nats = { version = "0.42", optional = true }
async-trait = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
# A2: /app 静态托管（ServeDir / ServeFile）
tower-http = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# 幂等键 → 稳定的 msg_id（重试要落在同一条消息上）
sha2 = { workspace = true }
# WP-13: request/tracing observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 平台数据目录惯例（macOS ~/Library/Application Support、Linux ~/.local/share）
dirs = "6"

[features]
default = []
redis = ["wxlike-mq/redis"]
nats = ["wxlike-mq/nats", "dep:async-nats"]

[dev-dependencies]
# integration tests drive the real HTTP surface (ureq matches the UI's client)
ureq = { version = "3", features = ["json"] }
# P3 ADR-8: the WS-gateway test is a real browser-shaped client
tokio-tungstenite = "0.24"
futures-util = "0.3"
# 优雅关闭测试要发真 SIGTERM（Child::kill 发的是 SIGKILL）
libc = "0.2"
